---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: inkwallconfigs.waf.inkwall.dev
spec:
  group: waf.inkwall.dev
  names:
    categories:
    - inkwall
    kind: InkwallConfig
    listKind: InkwallConfigList
    plural: inkwallconfigs
    singular: inkwallconfig
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.mode
      name: Mode
      type: string
    - jsonPath: .spec.suspend
      name: Suspended
      type: boolean
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          InkwallConfig is the cluster-wide Inkwall configuration. There is one,
          named default.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: InkwallConfigSpec is the cluster-wide configuration.
            properties:
              controlPlane:
                description: |-
                  ControlPlane is the control plane to connect to. Required in GitOps
                  and Managed mode, ignored in Standalone.
                properties:
                  endpoint:
                    description: Endpoint is the control plane's gRPC address, as
                      grpcs://host:port.
                    maxLength: 512
                    pattern: ^grpcs://[^/\s]+$
                    type: string
                  enrollmentSecretRef:
                    description: EnrollmentSecretRef is the Secret holding the enrollment
                      token.
                    properties:
                      name:
                        description: Name of the Secret.
                        maxLength: 253
                        minLength: 1
                        type: string
                      namespace:
                        description: Namespace of the Secret.
                        maxLength: 63
                        minLength: 1
                        type: string
                    required:
                    - name
                    - namespace
                    type: object
                required:
                - endpoint
                - enrollmentSecretRef
                type: object
              engine:
                description: Engine configures the engine sidecars the operator injects.
                properties:
                  bootstrapMode:
                    default: AllowAll
                    description: |-
                      BootstrapMode is what a new engine does with requests when it has no
                      bundle yet: no cached bundle, the bundle Secret unreadable and the
                      operator unreachable. It waits up to 10 seconds for one before its
                      proxy takes traffic, then allows (AllowAll) or rejects (DenyAll) the
                      requests until a bundle arrives. Applies to pods injected from then
                      on.
                    enum:
                    - AllowAll
                    - DenyAll
                    type: string
                  image:
                    description: |-
                      Image is the engine image. Empty means the image released with this
                      operator version.
                    maxLength: 512
                    type: string
                  resources:
                    description: |-
                      Resources of the engine container. Setting no CPU limit is
                      recommended: CPU throttling shows up as tail latency on every request.
                    properties:
                      claims:
                        description: |-
                          Claims lists the names of resources, defined in spec.resourceClaims,
                          that are used by this container.

                          This field depends on the
                          DynamicResourceAllocation feature gate.

                          This field is immutable. It can only be set for containers.
                        items:
                          description: ResourceClaim references one entry in PodSpec.ResourceClaims.
                          properties:
                            name:
                              description: |-
                                Name must match the name of one entry in pod.spec.resourceClaims of
                                the Pod where this field is used. It makes that resource available
                                inside a container.
                              type: string
                            request:
                              description: |-
                                Request is the name chosen for a request in the referenced claim.
                                If empty, everything from the claim is made available, otherwise
                                only the result of this request.
                              type: string
                          required:
                          - name
                          type: object
                        type: array
                        x-kubernetes-list-map-keys:
                        - name
                        x-kubernetes-list-type: map
                      limits:
                        additionalProperties:
                          anyOf:
                          - type: integer
                          - type: string
                          pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                          x-kubernetes-int-or-string: true
                        description: |-
                          Limits describes the maximum amount of compute resources allowed.
                          More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                        type: object
                      requests:
                        additionalProperties:
                          anyOf:
                          - type: integer
                          - type: string
                          pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                          x-kubernetes-int-or-string: true
                        description: |-
                          Requests describes the minimum amount of compute resources required.
                          If Requests is omitted for a container, it defaults to Limits if that is explicitly specified,
                          otherwise to an implementation-defined value. Requests cannot exceed Limits.
                          More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                        type: object
                    type: object
                  socketDir:
                    default: /var/run/inkwall
                    description: |-
                      SocketDir is the directory, shared with the proxy container, that
                      holds the engine's Unix sockets.
                    maxLength: 64
                    type: string
                    x-kubernetes-validations:
                    - message: socketDir must be an absolute path
                      rule: self.startsWith('/')
                type: object
              integrations:
                description: |-
                  Integrations pins how a proxy controller is wired. Controllers are
                  discovered without an entry here; an entry overrides the workload
                  selector or the adapter for one controller.
                items:
                  description: IntegrationSpec overrides discovery for one proxy controller.
                  properties:
                    adapter:
                      description: |-
                        Adapter is how the proxy hands requests to the engine, when the
                        controller supports several.
                      enum:
                      - ExtProc
                      - ExtAuthz
                      - LuaPlugin
                      - AuthURL
                      - ForwardAuth
                      - SPOE
                      - Module
                      type: string
                    controller:
                      description: Controller is the integration name, such as traefik
                        or ingress-nginx.
                      maxLength: 63
                      minLength: 1
                      type: string
                    selector:
                      description: |-
                        Selector matches the controller's proxy pods, when they don't carry
                        the controller's default labels. It must select by something (an
                        empty selector would match every pod). The operator restarts to
                        apply a change; pods already running are injected when they restart.
                      properties:
                        matchExpressions:
                          description: matchExpressions is a list of label selector
                            requirements. The requirements are ANDed.
                          items:
                            description: |-
                              A label selector requirement is a selector that contains values, a key, and an operator that
                              relates the key and values.
                            properties:
                              key:
                                description: key is the label key that the selector
                                  applies to.
                                type: string
                              operator:
                                description: |-
                                  operator represents a key's relationship to a set of values.
                                  Valid operators are In, NotIn, Exists and DoesNotExist.
                                type: string
                              values:
                                description: |-
                                  values is an array of string values. If the operator is In or NotIn,
                                  the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                  the values array must be empty. This array is replaced during a strategic
                                  merge patch.
                                items:
                                  type: string
                                type: array
                                x-kubernetes-list-type: atomic
                            required:
                            - key
                            - operator
                            type: object
                          type: array
                          x-kubernetes-list-type: atomic
                        matchLabels:
                          additionalProperties:
                            type: string
                          description: |-
                            matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                            map is equivalent to an element of matchExpressions, whose key field is "key", the
                            operator is "In", and the values array contains only "value". The requirements are ANDed.
                          type: object
                      type: object
                      x-kubernetes-map-type: atomic
                      x-kubernetes-validations:
                      - message: 'selector must not be empty: it would select every
                          pod'
                        rule: (has(self.matchLabels) && size(self.matchLabels) > 0)
                          || (has(self.matchExpressions) && size(self.matchExpressions)
                          > 0)
                  required:
                  - controller
                  type: object
                maxItems: 32
                type: array
                x-kubernetes-list-map-keys:
                - controller
                x-kubernetes-list-type: map
              mode:
                default: Standalone
                description: |-
                  Mode is where policy comes from: Standalone (the CRDs), GitOps (the
                  CRDs, mirrored to the control plane) or Managed (the control plane).
                enum:
                - Standalone
                - GitOps
                - Managed
                type: string
              signingKey:
                description: SigningKey configures the key the operator signs policy
                  bundles with.
                properties:
                  rotationInterval:
                    description: |-
                      RotationInterval rotates the signing key once it has signed for this
                      long, e.g. 2160h (90 days); at least 1h. Empty: the key rotates only
                      when requested with the waf.inkwall.dev/rotate-signing-key
                      annotation.
                    type: string
                    x-kubernetes-validations:
                    - message: rotationInterval must be at least 1h
                      rule: duration(self) >= duration('1h')
                type: object
              suspend:
                description: |-
                  Suspend switches every engine to allow-all within seconds, without
                  removing anything: the emergency switch (0004 §5).
                type: boolean
            type: object
            x-kubernetes-validations:
            - message: controlPlane is required in GitOps and Managed mode
              rule: '!has(self.mode) || self.mode == ''Standalone'' || has(self.controlPlane)'
          status:
            description: InkwallConfigStatus is the cluster view.
            properties:
              conditions:
                description: Conditions describe the configuration's state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: ObservedGeneration is the generation the status describes.
                format: int64
                type: integer
            type: object
        type: object
        x-kubernetes-validations:
        - message: the InkwallConfig must be named default
          rule: self.metadata.name == 'default'
    served: true
    storage: true
    subresources:
      status: {}
