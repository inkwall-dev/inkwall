kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: wafiplists.waf.inkwall.dev
spec:
  group: waf.inkwall.dev
  names:
    categories:
    - inkwall
    kind: WAFIPList
    listKind: WAFIPListList
    plural: wafiplists
    shortNames:
    - wafip
    singular: wafiplist
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Accepted")].status
      name: Accepted
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          WAFIPList is a list of client addresses that WAFPolicies in its
          namespace allow or deny (spec.ipLists). The client address is the one the
          engine resolves: see docs/client-ip.md.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: WAFIPListSpec is a list of client addresses.
            properties:
              entries:
                description: |-
                  Entries are the list's addresses and prefixes. Required. Up to
                  10,000, but the object must also fit etcd's request limit (1.5 MiB by
                  default): 10,000 entries fit without descriptions, about 4,500 with
                  256-byte ones; split a longer list into several WAFIPLists. A CIDR
                  listed twice draws a warning: v1 keys the entries by cidr
                  (listType=map) and refuses it.
                items:
                  description: IPListEntry is one address or CIDR prefix of a WAFIPList.
                  properties:
                    cidr:
                      description: |-
                        CIDR is an IPv4 or IPv6 prefix (203.0.113.0/24, 2001:db8::/32) or
                        address.
                      maxLength: 49
                      minLength: 2
                      pattern: ^[0-9A-Fa-f.:]+(/[0-9]{1,3})?$
                      type: string
                    description:
                      description: Description says what the entry is, for people.
                      maxLength: 256
                      type: string
                  required:
                  - cidr
                  type: object
                maxItems: 10000
                minItems: 1
                type: array
                x-kubernetes-list-type: atomic
            type: object
            x-kubernetes-validations:
            - message: entries is required
              rule: has(self.entries)
          status:
            description: WAFIPListStatus says whether the list is usable.
            properties:
              conditions:
                description: |-
                  Conditions describe the list's state: Accepted is True when every
                  entry parses as the engine parses it, and False (InvalidEntries)
                  naming the first that doesn't; the policies that use the list are
                  then not Accepted either.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: ObservedGeneration is the generation the status describes.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
