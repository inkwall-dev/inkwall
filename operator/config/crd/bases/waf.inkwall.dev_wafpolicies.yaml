---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: wafpolicies.waf.inkwall.dev
spec:
  group: waf.inkwall.dev
  names:
    categories:
    - inkwall
    kind: WAFPolicy
    listKind: WAFPolicyList
    plural: wafpolicies
    shortNames:
    - wafp
    singular: wafpolicy
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.mode
      name: Mode
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].reason
      name: Reason
      type: string
    - jsonPath: .status.bundleVersion
      name: Bundle
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          WAFPolicy protects routes: which rules run, in which mode, and what
          happens when inspection fails.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: WAFPolicySpec is what to enforce on which routes.
            properties:
              body:
                description: Body configures request body inspection.
                properties:
                  grpc:
                    description: |-
                      GRPC: Deny refuses requests with a gRPC or gRPC-Web content type
                      (403, or the gRPC status PermissionDenied to a gRPC client; logged in
                      Detect mode), for routes that serve no gRPC. Unset: Allow. Requires
                      engines 0.5.0 or later. See docs/grpc.md.
                    enum:
                    - Allow
                    - Deny
                    type: string
                  grpcMessages:
                    description: |-
                      GRPCMessages decides whether the text in gRPC calls' messages is
                      inspected: Inspect reads each protobuf message without its schema
                      and gives its text fields to the rules as form arguments; a message
                      that can't be read (cut at maxBytes, compressed other than with
                      gzip, not protobuf) is handled by onOversize. Unset: Skip, only the
                      call's path and metadata are inspected. See docs/grpc.md.
                    enum:
                    - Inspect
                    - Skip
                    type: string
                  grpcSchema:
                    description: |-
                      GRPCSchema reads the messages of the methods it describes with their
                      schema, with grpcMessages: Inspect: fields by their type and named by
                      their path (user.name), string fields as text, bytes fields by their
                      readable runs, numbers skipped. Methods and fields it doesn't
                      describe are read without it. Requires engines 0.7.0 or later: older
                      ones read every message without it. See docs/grpc.md.
                    properties:
                      configMapRef:
                        description: |-
                          ConfigMapRef names a key of a ConfigMap in the policy's namespace,
                          labeled waf.inkwall.dev/rules=true, whose binaryData holds a
                          FileDescriptorSet with its imports (buf build, or protoc
                          --include_imports --descriptor_set_out), raw or gzipped.
                        properties:
                          key:
                            description: |-
                              Key holding the SecLang rules (a rule set's) or the descriptor set (a
                              policy's grpcSchema).
                            maxLength: 253
                            minLength: 1
                            type: string
                          name:
                            description: Name of the ConfigMap.
                            maxLength: 253
                            minLength: 1
                            type: string
                        required:
                        - key
                        - name
                        type: object
                    required:
                    - configMapRef
                    type: object
                  grpcStreams:
                    description: |-
                      GRPCStreams decides how the messages are read, with grpcMessages:
                      Inspect. PerMessage inspects each message on its own as it comes,
                      up to maxBytes each, so long client streams and bidirectional calls
                      work; the messages before a denied one have already reached the
                      application. Through Envoy Gateway and Istio; other proxies buffer
                      the body as with Buffer. Unset: Buffer, the body the proxy buffers,
                      up to maxBytes in all. Requires engines 0.6.0 or later. See
                      docs/grpc.md.
                    enum:
                    - Buffer
                    - PerMessage
                    type: string
                  inspect:
                    default: true
                    description: Inspect turns body inspection on or off.
                    type: boolean
                  maxBytes:
                    description: |-
                      MaxBytes is how much of a body is inspected, at most 10 MiB. Unset:
                      the engine's --max-body-bytes (64 KiB unless an engine outside the
                      operator's wiring sets it), a default that doesn't change within v1.
                    format: int64
                    maximum: 10485760
                    minimum: 1
                    type: integer
                  onOversize:
                    description: |-
                      OnOversize is what happens to a body over maxBytes: Deny (413 in
                      Block mode) or Allow (forwarded uninspected, and logged). Unset: Deny
                      in Block mode, Allow in Detect mode.
                    enum:
                    - Allow
                    - Deny
                    type: string
                type: object
                x-kubernetes-validations:
                - message: 'grpcStreams: PerMessage needs grpcMessages: Inspect and
                    body inspection'
                  rule: '!has(self.grpcStreams) || self.grpcStreams != ''PerMessage''
                    || (has(self.grpcMessages) && self.grpcMessages == ''Inspect''
                    && (!has(self.inspect) || self.inspect))'
                - message: 'grpcSchema needs grpcMessages: Inspect'
                  rule: '!has(self.grpcSchema) || (has(self.grpcMessages) && self.grpcMessages
                    == ''Inspect'')'
              denyResponse:
                description: |-
                  DenyResponse is the body of the policy's denials (by a rule, an IP
                  list, the WebSocket or gRPC checks, a rate limit, a request that
                  couldn't be inspected in time, a response replaced), instead of the
                  engine's own text, with the denial's status. Unset: the
                  InkwallConfig's spec.engine.denyResponse, if set. Through Traefik,
                  Envoy Gateway, Istio and the engine's check API; HAProxy writes its
                  own denials. Requires engines 0.7.0 or later.
                properties:
                  body:
                    description: |-
                      Body is the denial's body, at most 8 KiB of UTF-8. Each
                      {{request_id}} in it is replaced with the request's ID. With a JSON
                      content type, it must be a JSON document.
                    maxLength: 8192
                    minLength: 1
                    type: string
                    x-kubernetes-validations:
                    - message: body must be at most 8 KiB (8192 bytes of UTF-8)
                      rule: size(bytes(self)) <= 8192
                  contentType:
                    description: |-
                      ContentType is the body's media type: text/html, text/plain,
                      application/json or application/problem+json, optionally with
                      "; charset=utf-8" (the body is UTF-8 either way).
                    maxLength: 64
                    type: string
                    x-kubernetes-validations:
                    - message: contentType must be text/html, text/plain, application/json
                        or application/problem+json, optionally with ; charset=utf-8
                      rule: self.lowerAscii().matches('^(text/html|text/plain|application/json|application/problem[+]json)(
                        *; *charset=utf-8)?$')
                required:
                - body
                - contentType
                type: object
              exclusions:
                description: Exclusions turn rules off where they cause false positives.
                items:
                  description: Exclusion turns rules off, everywhere or only for one
                    path or argument.
                  properties:
                    ruleIDs:
                      description: |-
                        RuleIDs are the rules to turn off. An ID no rule has is ignored.
                        Required. A set: an ID listed twice draws a warning, and v1 refuses
                        it.
                      items:
                        format: int32
                        minimum: 1
                        type: integer
                      maxItems: 64
                      minItems: 1
                      type: array
                      x-kubernetes-list-type: atomic
                    when:
                      description: |-
                        When narrows the exclusion. Unset: the rules are off for every request
                        this policy covers.
                      properties:
                        argument:
                          description: |-
                            Argument is a query or body argument the rules, and the rules chained
                            to them, stop looking at. With a rule set whose own SecLang negates
                            ARGS targets (!ARGS:name), the policy gets its own compiled rules, and
                            the exclusion covers the rule only, not its chained rules.
                          maxLength: 256
                          minLength: 1
                          pattern: ^[A-Za-z0-9_.\-\[\]]+$
                          type: string
                        argumentName:
                          description: |-
                            ArgumentName is a query or body argument whose name (ARGS_NAMES) the
                            rules stop looking at. Requires engines 0.5.0 or later: older ones
                            ignore the exclusion.
                          maxLength: 256
                          minLength: 1
                          pattern: ^[A-Za-z0-9_.\-\[\]]+$
                          type: string
                        cookie:
                          description: |-
                            Cookie is a request cookie (REQUEST_COOKIES) the rules stop looking
                            at, such as a session token. Requires engines 0.5.0 or later.
                          maxLength: 256
                          minLength: 1
                          pattern: ^[A-Za-z0-9_.\-\[\]]+$
                          type: string
                        header:
                          description: |-
                            Header is a request header (REQUEST_HEADERS) the rules stop looking
                            at, such as Referer, compared case-insensitively. Requires engines
                            0.5.0 or later.
                            v1 types it as a header name, refusing [ and ] and allowing the other
                            token characters (!#$%&'*+^|~): a header that isn't one draws a
                            warning.
                          maxLength: 256
                          minLength: 1
                          pattern: ^[A-Za-z0-9_.\-\[\]]+$
                          type: string
                        path:
                          description: Path the exclusion applies to.
                          maxLength: 1024
                          pattern: ^/[A-Za-z0-9._~/:@!$&'()+,=-]*\*?$
                          type: string
                      type: object
                      x-kubernetes-validations:
                      - message: when needs a path, or what in the request to stop
                          looking at
                        rule: has(self.path) || has(self.argument) || has(self.argumentName)
                          || has(self.cookie) || has(self.header)
                      - message: at most one of argument, argumentName, cookie and
                          header
                        rule: '[has(self.argument), has(self.argumentName), has(self.cookie),
                          has(self.header)].filter(x, x).size() <= 1'
                  type: object
                  x-kubernetes-validations:
                  - message: ruleIDs is required
                    rule: has(self.ruleIDs)
                maxItems: 128
                type: array
                x-kubernetes-list-type: atomic
              failureMode:
                description: |-
                  FailureMode is what happens to a request that can't be inspected in
                  time. Unset: Closed in Block mode, Open in Detect mode.
                enum:
                - Open
                - Closed
                type: string
              geo:
                description: |-
                  Geo denies clients by country, or lets only some countries in
                  (docs/geo-blocking.md), checked after the IP lists, before the
                  skipped paths, the rate limits and the rules. It needs a country
                  database (InkwallConfig spec.geo.database), and is only as right as
                  the client IP the engine resolves (docs/client-ip.md). Requires
                  engines 0.7.0 or later.
                properties:
                  allow:
                    description: |-
                      Allow lists the only countries whose clients get through geo. Unlike
                      an IP allow list, it doesn't skip inspection: their requests still go
                      through the rate limits and the rules.
                    items:
                      description: |-
                        CountryCode is an ISO 3166-1 alpha-2 country code, upper case: DE, US.
                        Codes the databases use that aren't officially assigned, such as XK
                        (Kosovo), are accepted; the webhook warns on others.
                      pattern: ^[A-Z]{2}$
                      type: string
                    maxItems: 250
                    minItems: 1
                    type: array
                    x-kubernetes-list-type: set
                  deny:
                    description: |-
                      Deny lists the countries whose clients are denied (403, reason
                      geo-deny).
                    items:
                      description: |-
                        CountryCode is an ISO 3166-1 alpha-2 country code, upper case: DE, US.
                        Codes the databases use that aren't officially assigned, such as XK
                        (Kosovo), are accepted; the webhook warns on others.
                      pattern: ^[A-Z]{2}$
                      type: string
                    maxItems: 250
                    minItems: 1
                    type: array
                    x-kubernetes-list-type: set
                  mode:
                    description: |-
                      Mode Detect logs what geo would deny instead of denying it, on a
                      Block policy too. Unset: the policy's mode.
                    enum:
                    - Detect
                    type: string
                  unknown:
                    default: Allow
                    description: |-
                      Unknown is what to do with a public address the database has no
                      country for: Allow (the default) or Deny.
                    enum:
                    - Allow
                    - Deny
                    type: string
                type: object
                x-kubernetes-validations:
                - message: geo needs exactly one of deny and allow
                  rule: has(self.deny) != has(self.allow)
              ipLists:
                description: |-
                  IPLists names WAFIPLists in the policy's namespace whose client
                  addresses are denied, or let through uninspected. A deny list wins
                  over an allow list. They are only as good as the client IP the
                  engine resolves (docs/client-ip.md). Requires engines 0.5.0 or
                  later.
                properties:
                  allow:
                    description: |-
                      Allow lists clients whose requests aren't inspected: health checkers,
                      a scanner you run yourself. Their requests are not logged either.
                    items:
                      description: IPListName names a WAFIPList.
                      maxLength: 253
                      minLength: 1
                      type: string
                    maxItems: 16
                    type: array
                    x-kubernetes-list-type: set
                  deny:
                    description: |-
                      Deny lists clients whose requests are denied (403) before any rule,
                      or logged in Detect mode.
                    items:
                      description: IPListName names a WAFIPList.
                      maxLength: 253
                      minLength: 1
                      type: string
                    maxItems: 16
                    type: array
                    x-kubernetes-list-type: set
                type: object
              llm:
                description: |-
                  LLM declares paths of the policy's routes as LLM APIs (OpenAI Chat
                  Completions, Responses or Embeddings, Anthropic Messages): their
                  request bodies are read up to maxBodyBytes, parsed strictly, and
                  checked natively (the model, the prompt's size, the messages, the
                  output limit, the roles and tools a client sends). A body that
                  doesn't parse one way, or fails a check, is denied with 400 (413 for
                  the size caps) in Block mode. The rule sets skip these bodies unless
                  ruleSetBody is Inspect. Requires engines 0.7.0 or later
                  (docs/llm-apis.md).
                properties:
                  endpoints:
                    description: |-
                      Endpoints are the policy's paths that serve an LLM API, each with
                      its format. Declared, not guessed: gateways and Azure OpenAI serve
                      these APIs on other paths. A path of no endpoint is an ordinary
                      route to the policy.
                    items:
                      description: LLMEndpoint is paths that serve one LLM API.
                      properties:
                        format:
                          description: Format is the shape of the endpoint's requests.
                          enum:
                          - OpenAIChat
                          - OpenAIResponses
                          - OpenAIEmbeddings
                          - AnthropicMessages
                          type: string
                        paths:
                          description: |-
                            Paths are exact paths or prefixes ending in "*", compared as rate
                            limits' match.paths: in ASCII lower case, with one trailing slash
                            ignored. A path the engine can't read one way (percent-encoding,
                            ";", "//", dot segments) is checked as an endpoint of each of the
                            policy's formats. skip.paths and skip.bodyPaths win: a body not read
                            isn't checked.
                          items:
                            description: |-
                              PathPattern is an exact path ("/healthz") or a prefix ending in "*"
                              ("/static/*"), using only plain ASCII path characters, as the engine
                              matches paths (pkg/router).
                            maxLength: 1024
                            pattern: ^/[A-Za-z0-9._~/:@!$&'()+,=-]*\*?$
                            type: string
                          maxItems: 16
                          minItems: 1
                          type: array
                          x-kubernetes-list-type: set
                      required:
                      - format
                      - paths
                      type: object
                    maxItems: 8
                    minItems: 1
                    type: array
                    x-kubernetes-list-type: atomic
                    x-kubernetes-validations:
                    - message: an endpoint path can't be in two endpoints
                      rule: self.all(e, e.paths.all(p, self.filter(f, p in f.paths).size()
                        == 1))
                  maxBodyBytes:
                    description: |-
                      MaxBodyBytes is the request body read on an endpoint, 1 KiB to 10
                      MiB, instead of body.maxBytes: chat histories and agents' contexts
                      are large. A longer body gets body.onOversize (413 in Block mode by
                      default). The proxy's own buffer still bounds what reaches the
                      engine (docs/llm-apis.md). Unset: 1 MiB.
                    format: int64
                    maximum: 10485760
                    minimum: 1024
                    type: integer
                  request:
                    description: |-
                      Request sets the request checks. Unset: only that bodies are
                      well-formed (llm-malformed).
                    properties:
                      clientRoles:
                        description: |-
                          ClientRoles are the roles of the messages a client may send
                          (llm-client-role); the Responses API's instructions and Anthropic's
                          system count as system, and a role none of these as none of them.
                          A chat front end that adds its own system prompt sets user and
                          assistant: a client that sends system or developer overrides it.
                          Unset: every role.
                        items:
                          description: LLMRole is who wrote a message.
                          enum:
                          - system
                          - developer
                          - user
                          - assistant
                          - tool
                          type: string
                        maxItems: 5
                        type: array
                        x-kubernetes-list-type: set
                      maxChoices:
                        description: |-
                          MaxChoices caps n, the answers a chat request asks for, 1 to 128
                          (llm-max-choices).
                        format: int32
                        maximum: 128
                        minimum: 1
                        type: integer
                      maxMessages:
                        description: |-
                          MaxMessages caps the messages, input items or embedding inputs of a
                          request, 1 to 100000 (llm-max-messages).
                        format: int32
                        maximum: 100000
                        minimum: 1
                        type: integer
                      maxOutputTokens:
                        description: |-
                          MaxOutputTokens caps the output limit a request sets (max_tokens,
                          max_completion_tokens, max_output_tokens), 1 to 10000000
                          (llm-max-output-tokens). Inkwall doesn't lower it: a request over
                          the cap is denied.
                        format: int64
                        maximum: 10000000
                        minimum: 1
                        type: integer
                      maxPromptBytes:
                        description: |-
                          MaxPromptBytes caps the UTF-8 bytes of the prompt's text, every
                          message together, 1 to 10 MiB (llm-max-prompt). Images, audio and
                          files count toward maxBodyBytes only.
                        format: int64
                        maximum: 10485760
                        minimum: 1
                        type: integer
                      mode:
                        description: |-
                          Mode Detect logs the requests that fail a check instead of denying
                          them, on a Block policy. Unset: the policy's mode. Block isn't
                          allowed: the checks can't be stricter than their policy.
                        enum:
                        - Detect
                        - Block
                        type: string
                        x-kubernetes-validations:
                        - message: 'the LLM checks'' mode can only be Detect: they
                            can''t be stricter than their policy'
                          rule: self == 'Detect'
                      models:
                        description: |-
                          Models are the models allowed: exact, or a prefix ending in "*",
                          compared in ASCII lower case. A request that names no model, or
                          another one, fails llm-model. Unset: any.
                        items:
                          description: |-
                            LLMModelPattern is a model ("llama-3.1-8b-instruct") or a prefix ending
                            in "*" ("qwen2.5-*"), printable ASCII without spaces.
                          maxLength: 256
                          minLength: 1
                          pattern: ^[!-)+-~]+\*?$
                          type: string
                        maxItems: 64
                        type: array
                        x-kubernetes-list-type: set
                      requireOutputTokens:
                        description: |-
                          RequireOutputTokens denies a request that sets no output limit
                          (llm-max-output-tokens): without one, OpenAI-compatible servers
                          generate up to the model's maximum. Embeddings have none to set.
                        type: boolean
                      tools:
                        description: 'Tools are the tools a client may define (llm-tools).
                          Unset: any.'
                        properties:
                          allow:
                            description: 'Allow is Any (the default), None, or Listed:
                              the tools names lists.'
                            enum:
                            - Any
                            - None
                            - Listed
                            type: string
                          names:
                            description: |-
                              Names are the tools a client may define with Listed: a function's
                              name, or a built-in tool's type when it has no name
                              ("web_search_preview"), compared exactly.
                            items:
                              description: LLMToolName is a tool's name.
                              maxLength: 256
                              minLength: 1
                              pattern: ^[A-Za-z0-9_.:/-]+$
                              type: string
                            maxItems: 128
                            type: array
                            x-kubernetes-list-type: set
                        type: object
                        x-kubernetes-validations:
                        - message: 'names is required with allow: Listed, and only
                            allowed with it'
                          rule: (has(self.allow) && self.allow == 'Listed') == (has(self.names)
                            && size(self.names) > 0)
                    type: object
                  ruleSetBody:
                    description: |-
                      RuleSetBody is whether the rule sets (the CRS, SecLang) inspect the
                      endpoints' request and response bodies too. Skip, the default: they
                      inspect the endpoints' method, URI, headers and cookies, and the LLM
                      checks the bodies; prose and pasted code trip the CRS's SQL
                      injection and XSS rules all the time, and its cost on large bodies
                      is out of every latency budget. This changes what the rule sets read
                      on a route that adds spec.llm. Inspect: they inspect the bodies, up
                      to maxBodyBytes, as on any route (unless body.inspect is false).
                    enum:
                    - Skip
                    - Inspect
                    type: string
                required:
                - endpoints
                type: object
              mode:
                default: Detect
                description: Mode is Detect (log, let through) or Block (reject).
                enum:
                - Detect
                - Block
                type: string
              rateLimits:
                description: |-
                  RateLimits limit how many requests a client may send, per engine:
                  over a limit, a request is denied with 429 and Retry-After before the
                  rules (logged in Detect mode). Each engine counts on its own, so a
                  client spread over N engines gets up to N times the limit
                  (docs/rate-limits.md). Clients in an IP allow list, and skipped
                  paths, are never counted. Requires engines 0.7.0 or later.
                items:
                  description: |-
                    RateLimit is a token bucket per key: it holds at most burst requests and
                    gains requests per period, evenly.
                  properties:
                    burst:
                      description: |-
                        Burst is the requests a key may send at once after being idle.
                        Unset: requests.
                      format: int64
                      maximum: 1000000
                      minimum: 1
                      type: integer
                    key:
                      description: 'Key is what the limit counts by. Unset: the client
                        IP.'
                      properties:
                        clientIP:
                          description: |-
                            ClientIP counts by the client address the engine resolves
                            (docs/client-ip.md).
                          properties:
                            ipv6PrefixLength:
                              description: |-
                                IPv6PrefixLength counts IPv6 clients by this prefix, 32 to 128;
                                IPv4 clients by their address. Unset: 56.
                              format: int32
                              maximum: 128
                              minimum: 32
                              type: integer
                          type: object
                        header:
                          description: |-
                            Header counts by a request header's value, for fairness between
                            authenticated clients (an API key, a tenant). A client chooses its
                            header's value, so this doesn't stop an attacker: a request without
                            the header is counted by its client IP.
                          properties:
                            name:
                              allOf:
                              - maxLength: 256
                              - maxLength: 128
                              description: |-
                                Name is the header. Not X-Forwarded-For, Forwarded or Host: count
                                by the client IP instead.
                              minLength: 1
                              pattern: ^[A-Za-z0-9!#$%&'*+.^_|~-]+$
                              type: string
                              x-kubernetes-validations:
                              - message: count by clientIP, not by X-Forwarded-For,
                                  Forwarded or Host
                                rule: '!(self.lowerAscii() in [''x-forwarded-for'',
                                  ''forwarded'', ''host''])'
                          required:
                          - name
                          type: object
                      type: object
                      x-kubernetes-validations:
                      - message: key needs exactly one of clientIP and header
                        rule: has(self.clientIP) != has(self.header)
                    match:
                      description: |-
                        Match narrows the limit to some of the policy's requests. Unset:
                        every request of the policy.
                      properties:
                        methods:
                          description: Methods the limit counts.
                          items:
                            description: RateLimitMethod is a standard HTTP request
                              method.
                            enum:
                            - GET
                            - HEAD
                            - POST
                            - PUT
                            - PATCH
                            - DELETE
                            - OPTIONS
                            - CONNECT
                            - TRACE
                            type: string
                          maxItems: 9
                          type: array
                          x-kubernetes-list-type: set
                        paths:
                          description: |-
                            Paths the limit counts: exact paths or prefixes ending in "*",
                            compared in ASCII lower case with one trailing slash ignored. A path
                            the engine can't read one way (percent-encoding, ";", "//", dot
                            segments) counts against every limit with paths.
                          items:
                            description: |-
                              PathPattern is an exact path ("/healthz") or a prefix ending in "*"
                              ("/static/*"), using only plain ASCII path characters, as the engine
                              matches paths (pkg/router).
                            maxLength: 1024
                            pattern: ^/[A-Za-z0-9._~/:@!$&'()+,=-]*\*?$
                            type: string
                          maxItems: 16
                          type: array
                          x-kubernetes-list-type: set
                      type: object
                    mode:
                      description: |-
                        Mode Detect logs the requests over the limit instead of denying
                        them, on a Block policy. Unset: the policy's mode. Block isn't
                        allowed: a limit can't be stricter than its policy.
                      enum:
