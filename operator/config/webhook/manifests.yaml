---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: inkwall-operator-mutating
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /mutate-v1-pod
  failurePolicy: Ignore
  name: pods.waf.inkwall.dev
  objectSelector:
    matchLabels:
      app.kubernetes.io/name: traefik
  reinvocationPolicy: Never
  rules:
  - apiGroups:
    - ""
    apiVersions:
    - v1
    operations:
    - CREATE
    resources:
    - pods
  sideEffects: None
  timeoutSeconds: 2
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: inkwall-operator-validating
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-waf-inkwall-dev-v1alpha1-clusterwafruleset
  failurePolicy: Fail
  name: clusterwafrulesets.waf.inkwall.dev
  rules:
  - apiGroups:
    - waf.inkwall.dev
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - clusterwafrulesets
  sideEffects: None
  timeoutSeconds: 2
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-waf-inkwall-dev-v1alpha1-wafpolicy
  failurePolicy: Fail
  name: wafpolicies.waf.inkwall.dev
  rules:
  - apiGroups:
    - waf.inkwall.dev
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - wafpolicies
  sideEffects: None
  timeoutSeconds: 2
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-waf-inkwall-dev-v1alpha1-wafruleset
  failurePolicy: Fail
  name: wafrulesets.waf.inkwall.dev
  rules:
  - apiGroups:
    - waf.inkwall.dev
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - wafrulesets
  sideEffects: None
  timeoutSeconds: 2
