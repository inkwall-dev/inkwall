# A stand-in for Gateway API's GatewayClass CRD
# (gateway.networking.k8s.io/v1), for operator tests: discovery and the
# wiring read only spec.controllerName.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: gatewayclasses.gateway.networking.k8s.io
  annotations:
    # Required for a *.k8s.io group, as upstream sets it.
    api-approved.kubernetes.io: https://github.com/kubernetes-sigs/gateway-api/pull/5371
spec:
  group: gateway.networking.k8s.io
  names:
    kind: GatewayClass
    listKind: GatewayClassList
    plural: gatewayclasses
    singular: gatewayclass
  scope: Cluster
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
