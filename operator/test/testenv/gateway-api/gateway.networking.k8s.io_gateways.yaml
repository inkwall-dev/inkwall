# A stand-in for Gateway API's Gateway CRD (gateway.networking.k8s.io/v1),
# for operator tests: the wiring reads only spec.gatewayClassName.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: gateways.gateway.networking.k8s.io
  annotations:
    # Required for a *.k8s.io group, as upstream sets it.
    api-approved.kubernetes.io: https://github.com/kubernetes-sigs/gateway-api/pull/5371
spec:
  group: gateway.networking.k8s.io
  names:
    kind: Gateway
    listKind: GatewayList
    plural: gateways
    singular: gateway
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
