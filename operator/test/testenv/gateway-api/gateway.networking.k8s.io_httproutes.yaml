# A stand-in for Gateway API's HTTPRoute CRD (gateway.networking.k8s.io/v1),
# for operator tests. Not installed at start, as none of gateway-api/
# (testenv.InstallGatewayAPI): the operator must start without the Gateway
# API and notice it once installed.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: httproutes.gateway.networking.k8s.io
  annotations:
    # Required for a *.k8s.io group, as upstream sets it.
    api-approved.kubernetes.io: https://github.com/kubernetes-sigs/gateway-api/pull/5371
spec:
  group: gateway.networking.k8s.io
  names:
    kind: HTTPRoute
    listKind: HTTPRouteList
    plural: httproutes
    singular: httproute
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
