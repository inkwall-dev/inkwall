# A stand-in for Envoy Gateway's EnvoyExtensionPolicy CRD (gateway.envoyproxy.io/v1alpha1),
# for operator tests. Not installed at start (testenv.InstallEnvoyGateway).
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: envoyextensionpolicies.gateway.envoyproxy.io
spec:
  group: gateway.envoyproxy.io
  names:
    kind: EnvoyExtensionPolicy
    listKind: EnvoyExtensionPolicyList
    plural: envoyextensionpolicies
    singular: envoyextensionpolicy
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
