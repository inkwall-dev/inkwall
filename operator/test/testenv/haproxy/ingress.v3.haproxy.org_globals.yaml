# A stand-in for the HAProxy Kubernetes Ingress Controller's Global CRD
# (ingress.v3.haproxy.org/v3), for operator tests. Not installed at start
# (testenv.InstallHAProxy).
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: globals.ingress.v3.haproxy.org
spec:
  group: ingress.v3.haproxy.org
  names:
    kind: Global
    listKind: GlobalList
    plural: globals
    singular: global
  scope: Namespaced
  versions:
    - name: v3
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
