// The policy bundle (0002 §4.3): everything an engine enforces, compiled by
// the operator from the cluster's WAFPolicy and rule set objects. Routes are
// resolved to concrete host / path / method matches by the operator, so the
// engine needs no Kubernetes knowledge. A bundle is immutable: every change
// produces a new version.
syntax = "proto3";

package inkwall.bundle.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/inkwall-dev/inkwall/api/bundle/v1;bundlev1";

// SignedBundle carries a Bundle with its signature. The signature covers the
// exact bytes of bundle, so the engine verifies before decoding, and
// re-encoding never invalidates it (protobuf encoding is not canonical).
message SignedBundle {
  // A serialized Bundle.
  bytes bundle = 1;
  // Ed25519 signature of bundle.
  bytes signature = 2;
  // The signing key, so engines can hold the old and the new public key
  // while the key rotates.
  string key_id = 3;
}

// Bundle is the complete policy of one cluster.
message Bundle {
  // Increases with every new bundle of the cluster; an engine never applies
  // a version older than the one it runs.
  uint64 version = 1;
  // The cluster the bundle was built for.
  string cluster_id = 2;
  google.protobuf.Timestamp created_at = 3;
  // SHA-256 of the bundle's content, without version, created_at and
  // content_hash itself: equal hashes mean equal policy.
  bytes content_hash = 4;
  repeated Policy policies = 5;
  // The rule sets the policies use, each once.
  repeated RuleSet rule_sets = 6;
  // The emergency switch (InkwallConfig.spec.suspend): every request is
  // allowed uninspected.
  bool suspended = 7;
  // The operator's bookkeeping, not part of content_hash; engines ignore it.
  // policy_versions[i] is the first bundle that enforces policies[i] as it
  // is in this one (its status.bundleVersion), so a new leader continues it.
  // Empty in bundles of operators before v0.3.0.
  repeated uint64 policy_versions = 8;
  // The key of the operator's HAProxy probe (0002 §6.4): the SPOE adapter
  // answers a request to /.well-known/inkwall-probe/ whose X-Inkwall-Probe
  // header is a MAC under this key, so the operator can tell that HAProxy
  // runs the filter on a route. 32 random bytes, or empty: no probes.
  bytes probe_key = 9;
  // What the engines' security events may carry
  // (InkwallConfig.spec.events). Unset: the defaults.
  EventsConfig events = 10;
  // The country table the policies' geo blocking uses (design 0011 §4.3),
  // set only when some policy uses it. The table travels on its own on the
  // stream (agent.v1 CountryTableMessage) and in the inkwall-geo Secrets;
  // the bundle, signed, pins it by hash. Unset: geo is skipped. Engines
  // before 0.7.0 ignore it.
  GeoTableRef geo_table = 11;
  // The denial of a policy that sets none
  // (InkwallConfig.spec.engine.denyResponse). Unset: the engine's own.
  // Engines before 0.7.0 ignore it.
  DenyResponse deny_response = 12;
  // The gRPC schemas the policies read messages with
  // (BodyConfig.grpc_schema_id), each once, sorted by id (design 0013 §5.3).
  // Engines before 0.7.0 ignore them and read messages without a schema.
  repeated GRPCSchema grpc_schemas = 20;
}

// GRPCSchema is a policy's descriptor set (a FileDescriptorSet the operator
// validated), compiled into what reading a gRPC message needs (design 0013
// §5.2): the methods' input and output types and each message's fields, by
// number. Engines check its integers on load and never parse descriptors.
message GRPCSchema {
  // Hex SHA-256 of methods and messages as serialized: names the schema in
  // BodyConfig.grpc_schema_id, and in the engine's cache.
  string id = 1;
  // Sorted by path, each once.
  repeated GRPCMethod methods = 2;
  // Referenced by index from methods and fields.
  repeated GRPCMessage messages = 3;
  // "namespace/configmap/key": where the descriptor set came from, for
  // inkwallctl explain.
  string source = 4;
}

// GRPCMethod is a method of a service the schema describes.
message GRPCMethod {
  // "/package.Service/Method", as a call's :path.
  string path = 1;
  // The input type: an index into GRPCSchema.messages.
  uint32 input = 2;
  // The output type, for responses (later): an index into
  // GRPCSchema.messages.
  uint32 output = 3;
}

// GRPCMessage is a message type.
message GRPCMessage {
  // The full name ("package.Message"), which an Any's type_url ends with.
  string full_name = 1;
  // Sorted by number, each number once.
  repeated GRPCField fields = 2;
  // google.protobuf.Any: field 1 is the type_url, field 2 the value of
  // the type it names.
  bool any = 3;
}

// GRPCField is a field of a message type.
message GRPCField {
  uint32 number = 1;
  // The proto name, or "[package.extension]" for an extension.
  string name = 2;
  GRPCFieldKind kind = 3;
  // For MESSAGE and GROUP only: the field's type, an index into
  // GRPCSchema.messages.
  uint32 message = 4;
  // The field is repeated: a repeated number may come packed.
  bool repeated = 5;
}

// GRPCFieldKind is how a field is read.
enum GRPCFieldKind {
  GRPC_FIELD_KIND_UNSPECIFIED = 0;
  GRPC_FIELD_KIND_STRING = 1;
  GRPC_FIELD_KIND_BYTES = 2;
  GRPC_FIELD_KIND_MESSAGE = 3;
  GRPC_FIELD_KIND_GROUP = 4;
  // int32, int64, uint32, uint64, sint32, sint64, bool, enum.
  GRPC_FIELD_KIND_VARINT = 5;
  // fixed32, sfixed32, float.
  GRPC_FIELD_KIND_FIXED32 = 6;
  // fixed64, sfixed64, double.
  GRPC_FIELD_KIND_FIXED64 = 7;
}

// GeoTableRef names a country table.
message GeoTableRef {
  // The table hash: the SHA-256 of the gzipped CountryTable, as it is sent
  // and stored.
  bytes sha256 = 1;
  // The serialized CountryTable's size: the engine decompresses no more.
  uint64 size = 2;
}

// DenyResponse is the body of a policy's denials (docs/denial-responses.md):
// every denial its verdicts give, with the verdict's status and headers.
// A denied gRPC call keeps its gRPC status and no body.
message DenyResponse {
  // text/html, text/plain, application/json or application/problem+json,
  // with charset=utf-8 or no parameter.
  string content_type = 1;
  // At most 8 KiB of UTF-8. Each {{request_id}} in it is replaced with the
  // request's ID, escaped for the content type.
  string body = 2;
}

// EventsConfig redacts the security events engines send to the operator
// (0002 §8.3). The engine always redacts cookies, response bodies, the
// Authorization, Cookie, Set-Cookie and Proxy-Authorization headers, and
// arguments and headers whose names look like credentials; these add to
// that.
message EventsConfig {
  // More header names whose values leave no snippet, matched without
  // regard to case.
  repeated string redact_headers = 1;
  // More argument-name patterns: a match on an argument whose name
  // contains one, without regard to case, leaves no snippet.
  repeated string redact_arguments = 2;
  // Send no snippets at all.
  bool no_snippets = 3;
}

// Policy is one WAFPolicy, applied to the requests its routes match. A
// request matching no route of any policy is not inspected.
message Policy {
  // The WAFPolicy, as "namespace/name".
  string id = 1;
  // The requests the policy applies to. When routes of several policies
  // match a request, the most specific match wins (longest host, then
  // exact path over prefix, then longest path); the operator rejects
  // policies that would tie.
  repeated RouteMatch routes = 2;
  Mode mode = 3;
  FailureMode failure_mode = 4;
  // Inspection deadline per request. Unset: the engine's default.
  google.protobuf.Duration timeout = 5;
  // Paths never inspected, and paths whose body is not inspected, in the
  // engine router's syntax: exact ("/healthz") or prefix ("/static/*").
  repeated string skip_paths = 6;
  repeated string skip_body_paths = 7;
  // The rule sets to run, in order. Empty: the built-in OWASP CRS with its
  // defaults.
  repeated RuleSetBinding rule_sets = 8;
  repeated Exclusion exclusions = 9;
  // Unset: the engine's body defaults.
  BodyConfig body = 10;
  // What a WebSocket handshake must meet. Unset: nothing more than any
  // request. Engines before 0.4.0 ignore it: the operator doesn't count
  // them as enforcing a policy that sets it.
  WebSocketConfig websocket = 11;
  // Unset: responses are not inspected. Engines before 0.4.0 ignore it
  // and inspect requests only; the operator reports routes whose engine
  // doesn't inspect responses.
  ResponseConfig responses = 12;
  // Exclusions narrowed to an argument name, a cookie or a header. Apart
  // from exclusions so that engines before 0.5.0, which don't know those
  // fields, ignore them (more rules apply) instead of reading them as
  // turning the rules off entirely.
  repeated Exclusion target_exclusions = 13;
  // The client addresses the policy denies or lets through uninspected,
  // resolved from its IP lists. Unset: none. Engines before 0.5.0 ignore
  // it: the operator doesn't count them as enforcing a policy that sets it.
  IPLists ip_lists = 14;
  // Rate limits, checked after the IP lists and the skipped paths, before
  // the rules. Engines before 0.7.0 ignore them: the operator doesn't count
  // them as enforcing a policy that sets them.
  repeated RateLimit rate_limits = 15;
  // The body of the policy's denials. Unset: Bundle.deny_response. Engines
  // before 0.7.0 ignore it: the operator doesn't count them as enforcing a
  // policy that sets it.
  DenyResponse deny_response = 16;
}

// RateLimit is a token bucket per key: it holds at most burst requests and
// gains requests per period, evenly. Each engine counts on its own.
message RateLimit {
  // Unique in the policy. With the policy and the key, it names the
  // limit's buckets across bundles: a new name starts them full, a new
  // rate or burst keeps them.
  string name = 1;
  uint32 requests = 2;
  google.protobuf.Duration period = 3;
  // 0: requests.
  uint32 burst = 4;
  RateLimitKey key = 5;
  // Paths counted, in the engine router's syntax, compared in ASCII lower
  // case with one trailing slash ignored. Empty: every path.
  repeated string paths = 6;
  // Methods counted, upper case. Empty: every method.
  repeated string methods = 7;
  // Log the requests over the limit instead of denying them.
  bool detect = 8;
}

// RateLimitKey is what a limit counts by. Unset: the client IP, IPv6 by
// its /56.
message RateLimitKey {
  oneof key {
    ClientIPKey client_ip = 1;
    HeaderKey header = 2;
  }
}

message ClientIPKey {
  // 0: 56.
  uint32 ipv6_prefix_length = 1;
}

// HeaderKey counts by a header's first value, hashed; a request without it
// counts by its client IP.
message HeaderKey {
  // Lower case.
  string name = 1;
}

// IPLists are a policy's IP lists, as CIDR prefixes (10.0.0.0/8,
// 2001:db8::/32) or addresses. A client in deny is denied; one in allow
// and not in deny is not inspected.
message IPLists {
  repeated string allow = 1;
  repeated string deny = 2;
}

// RouteMatch matches requests by host, path and method.
message RouteMatch {
  // Exact host ("shop.example.com") or a wildcard ("*.example.com"), without
  // a port, lower case. Empty: any host. A wildcard matches one leading label,
  // as in an Ingress, unless wildcard_any_depth is set.
  string host = 1;
  PathMatch path = 2;
  // Methods to match, upper case. Empty: any method.
  repeated string methods = 3;
  // A wildcard host matches subdomains at any depth: "*.example.com" matches
  // "a.b.example.com", as in a Gateway API HTTPRoute. Engines before 0.3.0
  // ignore it and match one label.
  bool wildcard_any_depth = 4;
}

// PathMatch matches the request path.
message PathMatch {
  PathMatchType type = 1;
  // An absolute, clean path.
  string value = 2;
}

// PathMatchType is how PathMatch.value is compared.
enum PathMatchType {
  PATH_MATCH_TYPE_UNSPECIFIED = 0;
  // The whole path equals value.
  PATH_MATCH_TYPE_EXACT = 1;
  // The path starts with value element by element, as Kubernetes Ingress
  // and Gateway API prefix matches do: "/foo" matches "/foo" and
  // "/foo/bar", not "/foobar".
  PATH_MATCH_TYPE_PREFIX = 2;
}

// Mode is what the engine does with a request the rules flag.
enum Mode {
  MODE_UNSPECIFIED = 0;
  // Log the verdict, let the request through.
  MODE_DETECT = 1;
  // Reject the request.
  MODE_BLOCK = 2;
}

// FailureMode is what happens to a request that can't be inspected in time.
enum FailureMode {
  // Closed in block mode, open in detect mode.
  FAILURE_MODE_UNSPECIFIED = 0;
  // Let the request through uninspected.
  FAILURE_MODE_OPEN = 1;
  // Reject the request with 503.
  FAILURE_MODE_CLOSED = 2;
}

// RuleSetBinding uses a rule set in a policy.
message RuleSetBinding {
  // RuleSet.id.
  string rule_set_id = 1;
  // OWASP CRS paranoia level, 1-4; 0: the default. Built-in CRS only.
  int32 paranoia_level = 2;
  // OWASP CRS inbound anomaly threshold; 0: the default. Built-in CRS only.
  int32 inbound_anomaly_threshold = 3;
  // The CRS's other settings. Built-in CRS only. Engines before 0.5.0
  // ignore it.
  CRSSettings crs = 4;
  // Where a SecLang rule set loads: unset, after the built-in CRS. Ignored
  // for the built-in CRS. Engines before 0.6.0 ignore it and load the rule
  // set after the CRS: the operator doesn't count them as enforcing a
  // policy that places one before it.
  RuleSetPlacement placement = 5;
}

// RuleSetPlacement is where a SecLang rule set loads, relative to the
// built-in CRS. Rule sets of the same placement load in the policy's order.
enum RuleSetPlacement {
  // After the CRS, as RULE_SET_PLACEMENT_AFTER_CRS.
  RULE_SET_PLACEMENT_UNSPECIFIED = 0;
  // After the CRS: custom rules and configure-time exclusions
  // (SecRuleRemoveById, SecRuleUpdateTargetById).
  RULE_SET_PLACEMENT_AFTER_CRS = 1;
  // Before the CRS (and its initialization, REQUEST-901), as the standalone
  // engine's --rules-before-crs: rules that set the CRS's TX variables or
  // turn CRS rules off at runtime (ctl:ruleRemoveById).
  RULE_SET_PLACEMENT_BEFORE_CRS = 2;
}

// CRSSettings are OWASP CRS variables the engine sets on each transaction,
// before the CRS's own defaults. Unset fields keep the CRS's defaults.
message CRSSettings {
  // tx.allowed_methods: the request methods allowed (rule 911100).
  repeated string allowed_methods = 1;
  // tx.allowed_request_content_type: the request media types allowed, as
  // type/subtype without parameters (rule 920420).
  repeated string allowed_request_content_types = 2;
  // tx.detection_paranoia_level, from the binding's paranoia level to 4;
  // 0: the paranoia level. Rules above the paranoia level and up to this one
  // log and never block.
  int32 detection_paranoia_level = 3;
  // tx.outbound_anomaly_score_threshold: the response anomaly score at
  // which a response is blocked; 0: the CRS's default (4).
  int32 outbound_anomaly_threshold = 4;
}

// RuleSet is a WAFRuleSet or ClusterWAFRuleSet, with its rules resolved.
message RuleSet {
  // "WAFRuleSet/namespace/name" or "ClusterWAFRuleSet/name".
  string id = 1;
  oneof source {
    // A rule set shipped in the engine image.
    BuiltinRuleSet builtin = 2;
    // SecLang rules, loaded after the Core Rule Set. Rules read from a
    // ConfigMap are inlined here by the operator.
    string seclang = 3;
  }
}

// BuiltinRuleSet names a rule set shipped in the engine image, pinned to the
// engine's version.
enum BuiltinRuleSet {
  BUILTIN_RULE_SET_UNSPECIFIED = 0;
  // OWASP Core Rule Set v4.
  BUILTIN_RULE_SET_CRS_V4 = 1;
}

// Exclusion turns rules off, everywhere or for a path, an argument or both.
message Exclusion {
  // The rules to turn off; an ID no rule has is ignored.
  repeated uint32 rule_ids = 1;
  // Exact or prefix path in the router's syntax. Empty: every path.
  string path = 2;
  // A query or body argument the rules (and the rules chained to them) stop
  // looking at. Empty, as the three below: the rules are off entirely (on
  // path, when set). At most one of the four is set.
  string argument = 3;
  // An argument name (ARGS_NAMES) the rules stop looking at. Only in
  // Policy.target_exclusions.
  string argument_name = 4;
  // A request cookie (REQUEST_COOKIES) the rules stop looking at. Only in
  // Policy.target_exclusions.
  string cookie = 5;
  // A request header (REQUEST_HEADERS) the rules stop looking at. Only in
  // Policy.target_exclusions.
  string header = 6;
}

// BodyConfig configures request body inspection.
message BodyConfig {
  // Inspect request bodies.
  bool inspect = 1;
  // Bytes of a body that are inspected; 0: the engine's default.
  int64 max_bytes = 2;
  OversizeAction on_oversize = 3;
  // Inspect the text in gRPC calls' messages (docs/grpc.md).
  bool grpc_messages = 4;
  // Deny a request with a gRPC or gRPC-Web content type, on routes that
  // serve no gRPC (#367). Engines before 0.5.0 ignore it: the operator
  // doesn't count them as enforcing a policy that sets it.
  bool deny_grpc = 5;
  // With grpc_messages, inspect a gRPC call's messages one by one as they
  // come (ext_proc streams the body), not the buffered body: long client
  // streams and bidirectional calls then work (#315). Engines before 0.6.0
  // ignore it and buffer: the operator doesn't count them as enforcing a
  // policy that sets it.
  bool grpc_per_message = 6;
  // With grpc_messages, the id of the Bundle.grpc_schemas entry the
  // messages of described methods are read with (design 0013); empty: read
  // without a schema. Engines before 0.7.0 ignore it: the operator doesn't
  // count them as enforcing a policy that sets it.
  string grpc_schema_id = 20;
}

// WebSocketConfig is what a WebSocket handshake (a request with an
// Upgrade: websocket, Sec-WebSocket-Key or Sec-WebSocket-Version header)
// must meet. One that doesn't is denied with 403 in block mode, logged in
// detect mode. Other requests aren't affected.
message WebSocketConfig {
  // The origins a handshake may come from: "scheme://host" or
  // "scheme://host:port", lower case, http or https; the host may start
  // with "*." to match any subdomain. Empty: any origin.
  repeated string allowed_origins = 1;
  // Let a handshake without an Origin header pass the origin check.
  bool allow_missing_origin = 2;
  // Headers a handshake must have, not empty.
  repeated string required_headers = 3;
}

// ResponseConfig configures response inspection (CRS RESPONSE-95x data
// leakage rules, and the user's phase 3 and 4 rules). Only adapters that see
// responses (ext_proc, the SPOE agent, the reverse proxy) inspect them.
message ResponseConfig {
  // Inspect responses: their status and headers, and their body when its
  // media type is one the rules read and max_bytes is set.
  bool inspect = 1;
  // Bytes of a response body that are inspected; 0: the engine's default.
  // A longer body has this prefix inspected, and gets on_oversize.
  int64 max_bytes = 2;
  // What happens to a response whose body is longer than max_bytes, or
  // can't be inspected (an encoding the engine can't decode): DENY
  // replaces it with 502 in block mode.
  OversizeAction on_oversize = 3;
  // Inspect streamed responses (Server-Sent Events, gRPC server streams)
  // event by event, each up to max_bytes; false: their bodies pass
  // uninspected. Engines before 0.6.0 ignore it.
  bool streams = 4;
}

// OversizeAction is what happens to a body larger than max_bytes.
enum OversizeAction {
  // Deny in block mode, allow in detect mode.
  OVERSIZE_ACTION_UNSPECIFIED = 0;
  // Forward with the body uninspected, and log.
  OVERSIZE_ACTION_ALLOW = 1;
  // Reject with 413 in block mode.
  OVERSIZE_ACTION_DENY = 2;
}
