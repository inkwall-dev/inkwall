// Bundle distribution between the operator and the engines (0002 §5.2).
// Each engine keeps one long-lived stream open; the operator pushes the
// current bundle, and the engine reports what it applied and sends its
// security events. Full bundles, not deltas: bundles are small, and a full
// snapshot is idempotent.
syntax = "proto3";

package inkwall.agent.v1;

import "bundle/v1/bundle.proto";
import "events/v1/events.proto";
import "events/v1/stats.proto";

option go_package = "github.com/inkwall-dev/inkwall/api/agent/v1;agentv1";

// BundleService is served by every operator replica.
service BundleService {
  // Watch is the engine's stream. The engine sends Hello first; the operator
  // answers with the current bundle, then with every new one. The engine
  // answers each bundle with Ack or Nack and sends heartbeats, its
  // security events and its request counts.
  rpc Watch(stream WatchRequest) returns (stream WatchResponse);
}

// WatchRequest is a message from the engine (EngineMessage in 0002 §5.2).
message WatchRequest {
  oneof msg {
    Hello hello = 1;
    Ack ack = 2;
    Nack nack = 3;
    Heartbeat heartbeat = 4;
    // Security events (0002 §5.4), redacted, in order of time, at most
    // 1,000 per batch. Best effort: an engine keeps a bounded buffer and
    // drops the oldest when it is full, counted in the next batch.
    inkwall.events.v1.EventBatch events = 5;
    // Requests per policy (0002 §5.4), with the heartbeats. Cumulative over
    // the stream: the first report on a stream counts from zero, and also
    // has what the engine counted after its last report on the previous
    // one. So the operator adds up the differences between reports, and an
    // engine that moves to another replica, or restarts, is never counted
    // twice. A report is split into messages of at most 32 KiB, each with
    // different policies; only policies whose counts changed are sent.
    inkwall.events.v1.RequestStats stats = 6;
  }
}

// WatchResponse is a message from the operator (OperatorMessage in 0002
// §5.2).
message WatchResponse {
  oneof msg {
    inkwall.bundle.v1.SignedBundle bundle = 1;
  }
  // 2 is reserved for directives to the engine (rotate logs, dump a
  // profile).
  reserved 2;
}

// Hello opens the stream.
message Hello {
  // Unique per engine process.
  string engine_id = 1;
  // The engine's pod.
  string pod_namespace = 2;
  string pod_name = 3;
  string node_name = 4;
  // The bundle the engine runs (0: none): the operator skips sending it
  // again when it is current.
  uint64 bundle_version = 5;
  // The engine's version.
  string engine_version = 6;
  // The IDs of the bundle signing keys the engine trusts (SignedBundle
  // key_id), so the operator signs with a new key only once every engine
  // has it. Empty from engines that predate key rotation.
  repeated string trusted_key_ids = 7;
}

// Ack reports a bundle the engine applied.
message Ack {
  uint64 bundle_version = 1;
}

// Nack reports a bundle the engine rejected; it keeps running the previous
// one.
message Nack {
  uint64 bundle_version = 1;
  // Why, e.g. a bad signature or a rule that doesn't compile.
  string error = 2;
}

// Heartbeat reports the engine's state, every few seconds.
message Heartbeat {
  // The bundle the engine runs.
  uint64 bundle_version = 1;
  // Requests being inspected, and the most that can be.
  uint32 in_flight = 2;
  uint32 capacity = 3;
  // The signing keys the engine trusts, as in Hello: they change while
  // the stream is open when the engine reloads its key file.
  repeated string trusted_key_ids = 4;
}
