# SPOE configuration for the Inkwall engine's agent (inkwall-engine spoe).
# HAProxy sends the message inkwall-request when the frontend's http-request
# rules are about to run, and the agent sets txn.inkwall.action ("allow" or
# "deny"), txn.inkwall.status (the status to deny with) and
# txn.inkwall.request_id. See docs/design/0006-adapter-protocols.md §4.

[inkwall]
spoe-agent inkwall
    messages inkwall-request
    option var-prefix inkwall
    # txn.inkwall.error says why there is no verdict (1: timeout, ...).
    option set-on-error error
    # Above the engine's --timeout (250ms by default), so the engine's own
    # failure mode decides a slow inspection.
    timeout processing 500ms
    use-backend inkwall-engine
    register-var-names action status request_id error

spoe-message inkwall-request
    args method=method path=pathq version=req.ver headers=req.hdrs_bin body=req.body ip=src https=ssl_fc
    event on-frontend-http-request
