# The demo app published through Traefik and protected by the engine sidecar
# in Traefik's pod (traefik-values.yaml). Applied after demo.yaml.

# Traefik talks to the app directly; the app's own sidecar (demo.yaml) is
# only for the standalone reverse-proxy path.
apiVersion: v1
kind: Service
metadata:
  name: demo-app
  namespace: inkwall-demo
spec:
  selector:
    app: demo
  ports:
    - name: http
      port: 8080
      targetPort: app
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: inkwall
  namespace: inkwall-demo
spec:
  forwardAuth:
    address: http://127.0.0.1:9001/v1/forward-auth
    # Must be false: with true, Traefik keeps a client's own X-Forwarded-Uri
    # and the engine would inspect that instead of the real URI.
    trustForwardHeader: false
    # Without the body, request bodies reach the app uninspected. The limit
    # is above the engine's --max-body-bytes so the engine's oversize policy
    # decides; Traefik answers 401 itself for bodies over maxBodySize.
    forwardBody: true
    maxBodySize: 1048576
    authResponseHeaders:
      - X-Request-Id
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: demo
  namespace: inkwall-demo
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: inkwall-demo-inkwall@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: demo-app
                port:
                  name: http
---
# The engine's metrics and health endpoints, for the smoke test.
apiVersion: v1
kind: Service
metadata:
  name: inkwall-engine-admin
  namespace: traefik
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: traefik
  ports:
    - name: admin
      port: 9480
      targetPort: 9480
      nodePort: 30482
