# The Traefik of the failure-mode suite (chaos.sh, #379): Ingresses of its
# own class only, nothing about Inkwall in it. Its namespace is one of the
# kind operator's proxy namespaces (hack/kind/operator.sh).
ingressClass:
  enabled: true
  isDefaultClass: false
  name: traefik-chaos

providers:
  kubernetesIngress:
    ingressClass: traefik-chaos
  kubernetesCRD:
    enabled: false
  kubernetesGateway:
    enabled: false

gateway:
  enabled: false
