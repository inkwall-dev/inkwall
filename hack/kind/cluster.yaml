# Local development cluster. The demo service's NodePorts are mapped to the
# same ports on the host, 30480 (proxy) and 30481 (admin), so they don't
# clash with an engine running locally on 8480/9480.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: inkwall
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30480
        hostPort: 30480
        listenAddress: 127.0.0.1
      - containerPort: 30481
        hostPort: 30481
        listenAddress: 127.0.0.1
