# Local development cluster. NodePorts are mapped to the same ports on the
# host, so they don't clash with an engine running locally on 8480/9480:
#   30480/30481  demo app behind the engine's reverse proxy, and its admin
#   30080/30482  demo app through Traefik + forward-auth, and the engine's admin
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: inkwall
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30480
        hostPort: 30480
        listenAddress: 127.0.0.1
      - containerPort: 30481
        hostPort: 30481
        listenAddress: 127.0.0.1
      - containerPort: 30080
        hostPort: 30080
        listenAddress: 127.0.0.1
      - containerPort: 30482
        hostPort: 30482
        listenAddress: 127.0.0.1
