apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: storefront
  namespace: shop
spec:
  rules:
  - host: shop.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service: {name: storefront, port: {number: 80}}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api
  namespace: shop
spec:
  parentRefs: [{name: web, namespace: gateway}]
  hostnames: [shop.example.com]
  rules:
  - matches: [{path: {type: PathPrefix, value: /api}}]
    backendRefs: [{name: api, port: 80}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: admin
  namespace: shop
spec:
  parentRefs: [{name: web, namespace: gateway}]
  hostnames: [admin.example.com]
  rules:
  - name: login
    matches:
    - path: {type: Exact, value: /login}
    backendRefs: [{name: admin, port: 80}]
  - name: static
    matches:
    - path: {type: PathPrefix, value: /static/}
    backendRefs: [{name: admin-static, port: 80}]
  - name: rest
    backendRefs: [{name: admin, port: 80}]
