# A Flux Kustomization that waits for the WAFPolicies it applies to be
# Ready (#377; docs/gitops.md, "Health in Argo CD and Flux"). Plain
# kstatus counts a policy the operator hasn't reported on yet as current,
# so the healthCheckExprs (Flux 2.5 or later) say what Ready means for the
# Inkwall kinds: current once Ready for the current generation; failed when
# Ready is False for a reason that doesn't resolve itself (wiring failed,
# an engine rejects the bundle, ...); in progress otherwise.
# hack/gitopshealth tests the expressions against examples/argocd/tests.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: shop-waf
  namespace: flux-system
spec:
  interval: 10m
  path: ./waf
  prune: true
  sourceRef: {kind: GitRepository, name: shop}
  wait: true
  timeout: 5m
  healthCheckExprs:
    - apiVersion: waf.inkwall.dev/v1alpha1
      kind: WAFPolicy
      current: >-
        has(status.observedGeneration) && status.observedGeneration == metadata.generation &&
        status.conditions.exists(c, c.type == 'Ready' && c.status == 'True')
      failed: >-
        has(status.observedGeneration) && status.observedGeneration == metadata.generation &&
        status.conditions.exists(c, c.type == 'Ready' && c.status == 'False' &&
        !(c.reason in ['Pending', 'PendingRestart', 'EnginesBehind', 'EnginesUnreported', 'NoEngines',
        'NotInBundle', 'Unverified', 'NotAccepted', 'NotProgrammed', 'NotEnforced', 'Suspended']))
    - apiVersion: waf.inkwall.dev/v1alpha1
      kind: WAFRuleSet
      current: >-
        has(status.observedGeneration) && status.observedGeneration == metadata.generation &&
        status.conditions.exists(c, c.type == 'Accepted' && c.status == 'True')
      failed: >-
        has(status.observedGeneration) && status.observedGeneration == metadata.generation &&
        status.conditions.exists(c, c.type == 'Accepted' && c.status == 'False')
    - apiVersion: waf.inkwall.dev/v1alpha1
      kind: ClusterWAFRuleSet
      current: >-
        has(status.observedGeneration) && status.observedGeneration == metadata.generation &&
        status.conditions.exists(c, c.type == 'Accepted' && c.status == 'True')
      failed: >-
        has(status.observedGeneration) && status.observedGeneration == metadata.generation &&
        status.conditions.exists(c, c.type == 'Accepted' && c.status == 'False')
