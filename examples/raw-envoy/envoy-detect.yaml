# Envoy in front of an app, every request inspected by Inkwall in detect mode:
# Envoy sends the engine a copy of each request and forwards it without
# waiting (ext_proc's observability_mode), and the engine logs what it would
# block. The engine runs next to Envoy (a process on the same host, or a
# sidecar in the same pod) and serves ext_proc on loopback:
#
#   inkwall-engine ext-proc --listen 127.0.0.1:9003 \
#     --mode detect --trusted-proxies 127.0.0.1/32,::1/128
#
# Check this file with `envoy --mode validate -c envoy-detect.yaml`. See
# docs/raw-envoy.md.
static_resources:
  listeners:
    - name: http
      address:
        socket_address: {address: 0.0.0.0, port_value: 8080}
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress
                # Envoy is the edge: X-Forwarded-For ends with the address of
                # its TCP peer, which the engine walks right to left
                # (--trusted-proxies).
                use_remote_address: true
                route_config:
                  virtual_hosts:
                    - name: app
                      domains: ["*"]
                      routes:
                        # A route left uninspected: the filter is off here.
                        - match: {path: /healthz}
                          route: {cluster: app}
                          typed_per_filter_config:
                            envoy.filters.http.ext_proc:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExtProcPerRoute
                              disabled: true
                        - match: {prefix: /}
                          route: {cluster: app}
                http_filters:
                  - name: envoy.filters.http.ext_proc
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
                      grpc_service:
                        envoy_grpc: {cluster_name: inkwall}
                      # Envoy doesn't wait for the engine's answers: detect
                      # mode adds no latency, and never blocks.
                      observability_mode: true
                      # The request headers and the body, streamed in chunks
                      # (the only body mode observability_mode allows); nothing
                      # of the response.
                      processing_mode:
                        request_header_mode: SEND
                        request_body_mode: STREAMED
                        request_trailer_mode: SKIP
                        response_header_mode: SKIP
                        response_body_mode: NONE
                        response_trailer_mode: SKIP
                      request_attributes: [request.protocol]
                      # The engine's deadline (--timeout, 250ms by default)
                      # plus 500ms.
                      message_timeout: 0.75s
                      # An engine Envoy can't reach: the request goes through,
                      # as the engine's failure mode in detect mode (open).
                      failure_mode_allow: true
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    # The engine: gRPC (HTTP/2) on loopback.
    - name: inkwall
      type: STATIC
      connect_timeout: 1s
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: inkwall
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: {address: 127.0.0.1, port_value: 9003}
    # The app.
    - name: app
      type: STRICT_DNS
      connect_timeout: 1s
      load_assignment:
        cluster_name: app
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: {address: app, port_value: 80}
