# The demo app behind istio, with a WAFPolicy in Detect mode:
#   kubectl apply -k examples/istio
# after installing Inkwall and istio (docs/quickstart.md for Traefik).
# examples/tests holds requests that make test-examples checks the policy
# against.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - app.yaml
  - route.yaml
  - wafpolicy.yaml
