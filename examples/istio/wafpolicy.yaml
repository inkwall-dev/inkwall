# The HTTPRoute's WAFPolicy: the Core Rule Set (a policy without ruleSets
# uses it), in Detect mode first.
apiVersion: waf.inkwall.dev/v1alpha1
kind: WAFPolicy
metadata:
  name: web
  namespace: shop
spec:
  targetRefs:
    - {group: gateway.networking.k8s.io, kind: HTTPRoute, name: web}
  mode: Detect
