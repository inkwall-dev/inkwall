# HAProxy (3.1 or later) in front of an app, every request inspected by
# Inkwall before it is forwarded: block mode. The engine runs next to
# HAProxy (a process on the same host, or a sidecar in the same pod) and is
# its SPOE agent on a Unix socket:
#
#   inkwall-engine spoe --listen unix:/var/run/inkwall/spoe.sock --mode block
#
# HAProxy must run as the engine's user (65532 in the engine image) to
# connect to the socket. Check this file with `haproxy -c -f haproxy.cfg`.
# See docs/haproxy.md.

global
    log stdout format raw local0

defaults
    mode http
    log global
    option httplog
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend web
    # HTTP/1.1, and HTTP/2 with prior knowledge (h2c).
    bind :8080
    # Wait for the body, up to HAProxy's buffer (tune.bufsize, 16 KiB by
    # default), before the agent is called: without it, bodies go
    # uninspected.
    option http-buffer-request
    filter spoe engine inkwall config /usr/local/etc/haproxy/spoe.conf
    # A request HAProxy can't fit in one SPOE frame (txn.inkwall.error 3,
    # or 259 over the engine's frame size) doesn't reach the engine: it is
    # oversized, 413, as --oversize-body deny says. Keep this rule first,
    # whatever the failure mode; leave it out in detect mode.
    http-request deny deny_status 413 if { var(txn.inkwall.error) -m int 3 259 }
    # Fail closed: without a verdict (the engine is down, or hung), deny
    # with 503. Leave this rule out to fail open. /healthz is left
    # uninspected (spoe.conf), so it has no verdict.
    http-request deny deny_status 503 if !{ var(txn.inkwall.action) -m found } !{ path /healthz }
    # A denied gRPC call: HTTP 200 and the gRPC status in the headers
    # (http-after-response sets its Content-Type).
    http-request return status 200 hdr grpc-status "%[var(txn.inkwall.grpc_status)]" hdr grpc-message "%[var(txn.inkwall.grpc_message)]" hdr x-request-id "%[var(txn.inkwall.request_id)]" if { var(txn.inkwall.grpc_status) -m found }
    # deny_status takes a fixed status: a rule per status the engine denies
    # with.
    http-request deny deny_status 400 hdr x-request-id "%[var(txn.inkwall.request_id)]" if { var(txn.inkwall.status) -m int 400 }
    http-request deny deny_status 413 hdr x-request-id "%[var(txn.inkwall.request_id)]" if { var(txn.inkwall.status) -m int 413 }
    http-request deny deny_status 503 hdr x-request-id "%[var(txn.inkwall.request_id)]" if { var(txn.inkwall.status) -m int 503 }
    http-request deny deny_status 403 hdr x-request-id "%[var(txn.inkwall.request_id)]" if { var(txn.inkwall.action) -m str deny }
    # The request ID of the engine's log, for the app.
    http-request set-header X-Request-Id "%[var(txn.inkwall.request_id)]" if { var(txn.inkwall.request_id) -m found }
    # Responses, inspected when the engine runs with --inspect-responses:
    # its answer sets txn.inkwall.responses for the requests whose
    # responses it inspects. The app sends them unencoded (the engine reads
    # gzip and deflate, not br or zstd).
    http-request del-header accept-encoding if { var(txn.inkwall.responses) -m found }
    # Wait for the body the rules read, up to HAProxy's buffer, then send
    # the response to the engine.
    http-response wait-for-body time 2s if { var(txn.inkwall.responses) -m found } { res.hdr(content-type) -m beg -i text/plain text/html text/xml application/json application/xml application/problem+json }
    http-response send-spoe-group inkwall inkwall-response if { var(txn.inkwall.responses) -m found }
    # A response HAProxy can't fit in one SPOE frame: oversized, 502, as
    # --oversize-response deny says (leave it out in detect mode).
    http-response return status 502 content-type text/plain lf-string "Bad Gateway. Request ID: %[var(txn.inkwall.request_id)]" hdr x-request-id "%[var(txn.inkwall.request_id)]" if { var(txn.inkwall.responses) -m found } { var(txn.inkwall.error) -m int 3 259 }
    # Fail closed: without a verdict on the response (the engine is down,
    # or hung), replace it with 502 when the request's policy fails
    # closed.
    http-response return status 502 content-type text/plain lf-string "Bad Gateway. Request ID: %[var(txn.inkwall.request_id)]" hdr x-request-id "%[var(txn.inkwall.request_id)]" if { var(txn.inkwall.responses) -m found } !{ var(txn.inkwall.response_action) -m found } { var(txn.inkwall.response_failure) -m str closed }
    # A denied response is replaced, the app's headers and body dropped: a
    # rule per status the engine denies with, 403 for any other.
    http-response return status 502 content-type text/plain lf-string "Bad Gateway. Request ID: %[var(txn.inkwall.request_id)]" hdr x-request-id "%[var(txn.inkwall.request_id)]" if { var(txn.inkwall.response_status) -m int 502 }
    http-response return status 503 content-type text/plain lf-string "Service Unavailable. Request ID: %[var(txn.inkwall.request_id)]" hdr x-request-id "%[var(txn.inkwall.request_id)]" if { var(txn.inkwall.response_status) -m int 503 }
    http-response return status 403 content-type text/plain lf-string "Forbidden. Request ID: %[var(txn.inkwall.request_id)]" hdr x-request-id "%[var(txn.inkwall.request_id)]" if { var(txn.inkwall.response_action) -m str deny }
    http-after-response set-header content-type "%[var(txn.inkwall.grpc_content_type)]" if { var(txn.inkwall.grpc_content_type) -m found }
    default_backend app

backend app
    server app app:80

backend inkwall-engine
    mode spop
    timeout connect 5s
    timeout server 3m
    # HELLO health checks: an engine that stops answering is marked down
    # within a second, and HAProxy stops waiting for it.
    option spop-check
    server engine unix@/var/run/inkwall/spoe.sock check inter 1s
