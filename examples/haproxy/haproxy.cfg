# HAProxy in front of an app, with the Inkwall engine as its SPOE agent:
# what hack/haproxy/test.sh runs. The ports come from the environment.

global
    log stdout format raw local0

defaults
    mode http
    log global
    option httplog
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend web
    bind "127.0.0.1:${HAPROXY_PORT}"
    bind "127.0.0.1:${HAPROXY_H2C_PORT}" proto h2
    # Wait for the body, up to the buffer (tune.bufsize), before the agent
    # is called: without it, the agent gets no body.
    option http-buffer-request
    filter spoe engine inkwall config /usr/local/etc/haproxy/spoe.conf
    # Fail closed: without a verdict (agent down, timed out), deny with 503.
    # To fail open, leave this rule out.
    http-request deny deny_status 503 if !{ var(txn.inkwall.action) -m found }
    http-request deny deny_status 400 if { var(txn.inkwall.status) -m int 400 }
    http-request deny deny_status 413 if { var(txn.inkwall.status) -m int 413 }
    http-request deny deny_status 503 if { var(txn.inkwall.status) -m int 503 }
    http-request deny deny_status 403 if { var(txn.inkwall.action) -m str deny }
    http-request set-header X-Request-Id %[var(txn.inkwall.request_id)] if { var(txn.inkwall.request_id) -m found }
    default_backend app

backend app
    server app "127.0.0.1:${APP_PORT}"

backend inkwall-engine
    mode spop
    timeout connect 5s
    timeout server 3m
    # HELLO health checks: a stopped engine is marked down at once.
    option spop-check
    server engine "127.0.0.1:${ENGINE_PORT}" check inter 1s
