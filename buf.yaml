version: v2
modules:
  - path: api
lint:
  use:
    - STANDARD
  except:
    # Files live in api/<name>/v1 (0002 §9); the package carries the
    # inkwall prefix so it is unique among other protobuf packages.
    - PACKAGE_DIRECTORY_MATCH
breaking:
  use:
    - FILE
