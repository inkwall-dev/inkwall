---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: inkwall-operator-validating
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-waf-inkwall-dev-v1alpha1-clusterwafruleset
  failurePolicy: Fail
  name: clusterwafrulesets.waf.inkwall.dev
  rules:
  - apiGroups:
    - waf.inkwall.dev
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - clusterwafrulesets
  sideEffects: None
  timeoutSeconds: 2
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-waf-inkwall-dev-v1alpha1-wafpolicy
  failurePolicy: Fail
  name: wafpolicies.waf.inkwall.dev
  rules:
  - apiGroups:
    - waf.inkwall.dev
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - wafpolicies
  sideEffects: None
  timeoutSeconds: 2
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-waf-inkwall-dev-v1alpha1-wafruleset
  failurePolicy: Fail
  name: wafrulesets.waf.inkwall.dev
  rules:
  - apiGroups:
    - waf.inkwall.dev
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - wafrulesets
  sideEffects: None
  timeoutSeconds: 2
