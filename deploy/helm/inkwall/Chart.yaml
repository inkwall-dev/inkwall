apiVersion: v2
name: inkwall
description: Inkwall, a Kubernetes-native web application firewall. Installs the operator, its CRDs and webhooks; the operator injects the engine into the proxies (Traefik, Envoy Gateway, Istio, the HAProxy Kubernetes Ingress Controller) and wires their routes.
type: application
# The chart and the operator are released together, from the same tag.
version: 0.1.0
appVersion: "0.1.0"
kubeVersion: ">=1.29.0-0"
home: https://github.com/inkwall-dev/inkwall
sources:
  - https://github.com/inkwall-dev/inkwall
# The license as Artifact Hub reads it: Chart.yaml has no license field, and
# Helm 4's lint --strict refuses unknown fields (#394).
annotations:
  artifacthub.io/license: Apache-2.0
keywords:
  - waf
  - security
  - coraza
  - owasp-crs
  - operator
