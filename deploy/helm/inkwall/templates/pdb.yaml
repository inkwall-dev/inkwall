{{- if and .Values.operator.podDisruptionBudget.enabled (gt (int .Values.operator.replicas) 1) }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "inkwall.operator.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "inkwall.operator.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.operator.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "inkwall.operator.selectorLabels" . | nindent 6 }}
{{- end }}
