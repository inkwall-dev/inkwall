{{- /*
The rules come from the operator's kubebuilder:rbac markers
(files/rbac/role.yaml, generated): cluster-wide rules go into a ClusterRole,
the namespaced ones into a Role in the release namespace. Each integration
has a ClusterRole of its own (inkwall-operator-<integration> in role.yaml),
left out when rbac.integrations turns it off: the operator then disables
that integration.
*/}}
{{- $name := include "inkwall.operator.name" . }}
{{- range (include "inkwall.generated" (dict "root" . "path" "files/rbac/role.yaml") | fromJsonArray) }}
{{- $integration := trimPrefix "inkwall-operator-" .metadata.name }}
{{- if or (eq .metadata.name "inkwall-operator") (include "inkwall.integration.enabled" (dict "root" $ "name" $integration)) }}
{{- $roleName := $name }}
{{- if ne .metadata.name "inkwall-operator" }}
{{- $roleName = printf "%s-%s" $name $integration | trunc 63 | trimSuffix "-" }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: {{ .kind }}
metadata:
  name: {{ $roleName }}
  {{- if eq .kind "Role" }}
  namespace: {{ $.Release.Namespace }}
  {{- end }}
  labels:
    {{- include "inkwall.operator.labels" $ | nindent 4 }}
rules:
  {{- toYaml .rules | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: {{ .kind }}Binding
metadata:
  name: {{ $roleName }}
  {{- if eq .kind "Role" }}
  namespace: {{ $.Release.Namespace }}
  {{- end }}
  labels:
    {{- include "inkwall.operator.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: {{ .kind }}
  name: {{ $roleName }}
subjects:
  - kind: ServiceAccount
    name: {{ include "inkwall.serviceAccountName" $ }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
