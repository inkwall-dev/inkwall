# Default values for the inkwall chart.

operator:
  image:
    repository: ghcr.io/inkwall-dev/inkwall-operator
    # Empty: the chart's appVersion.
    tag: ""
    pullPolicy: IfNotPresent

  # Two replicas: one leads (builds bundles), all serve the webhook. The
  # operator is never on the request path, so traffic doesn't depend on it.
  replicas: 2

  # The operator sets the Go runtime's soft memory limit (GOMEMLIMIT) to
  # 90% of limits.memory, so its GC works harder near the limit instead of
  # letting the heap double.
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi

  # Extra inkwall-operator flags.
  extraArgs: []

  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  # Empty: spread the replicas across nodes when possible.
  affinity: {}
  priorityClassName: ""

  podDisruptionBudget:
    # Created when replicas > 1.
    enabled: true
    minAvailable: 1

# The engine the operator injects into proxy pods (Traefik) as a sidecar.
engine:
  image:
    repository: ghcr.io/inkwall-dev/inkwall-engine
    # Empty: the chart's appVersion. InkwallConfig.spec.engine.image
    # overrides both.
    tag: ""
    pullPolicy: IfNotPresent

injection:
  # Inject the engine into proxy pods when they are created (a Pod webhook).
  # While no policy is in block mode it fails open: proxy pods start even
  # when the operator is down, without the engine. Once a policy blocks, the
  # operator makes it fail closed: proxy pods can't start without the
  # engine; running ones keep serving.
  # Pods that already run are injected when they restart.
  # false: no engine is injected, and the operator unwires every route it
  # wired (new proxy pods have no engine to call), serving them uninspected.
  enabled: true

controlPlane:
  # The optional control plane (0002 §3.4), for GitOps and Managed mode.
  # Nothing here connects by itself: set InkwallConfig.spec.mode and
  # spec.controlPlane (endpoint, enrollmentSecretRef), see the README.
  #
  # The control plane's CA (PEM), when its server certificate isn't from a
  # public CA; e.g. --set-file controlPlane.caBundle=ca.crt.
  caBundle: ""
  # The one-time enrollment token from the control plane. Set, the chart
  # stores it in a Secret in the release namespace (key "token") for
  # InkwallConfig's enrollmentSecretRef: inkwall-enrollment for a release
  # named inkwall, else <release>-inkwall-enrollment. It is used once; leave
  # it empty to create that Secret yourself.
  enrollmentToken: ""
  # Each replica's buffer of security events while the control plane is
  # unreachable (an emptyDir, kept across container restarts): when full,
  # the oldest are dropped and counted. Only used when the control plane
  # accepts events.
  eventsBufferMiB: 64

uninstall:
  # On helm uninstall, stop the operator and remove Inkwall's Middleware from
  # the routes it wired before anything else is deleted (a pre-delete hook),
  # so the routes keep working, uninspected. WAFPolicy objects are kept.
  # It also removes the operator's finalizer from the WAFPolicies, so
  # deleting them or their namespace doesn't wait for an operator that is
  # gone. Without the hook, Traefik pods started after the uninstall fail
  # every protected route (they have no engine, but the routes still call
  # it), and the policies keep the finalizer: see the README.
  unwire: true

rbac:
  # Each integration's permissions are in a ClusterRole of its own; false
  # leaves it out, e.g. for a proxy the cluster doesn't run, so the operator
  # isn't granted its resources. The operator then disables that
  # integration: policies on the routes of its proxy report
  # Programmed=False (IntegrationDisabled), and the others work.
  integrations:
    # Traefik's Middlewares, and the references to them in Ingresses,
    # IngressRoutes and HTTPRoutes.
    traefik: true
    # Envoy Gateway's EnvoyProxies, EnvoyExtensionPolicies, Backends and
    # ClientTrafficPolicies, a Gateway's parametersRef.
    envoyGateway: true

serviceAccount:
  # Empty: the operator's name (inkwall-operator for a release named inkwall).
  name: ""
  annotations: {}

crds:
  # Install and upgrade the CRDs with the chart. They are kept on uninstall
  # (deleting a CRD deletes every object of its kind).
  install: true

distribution:
  # Engines connect here (gRPC over TLS, with the webhook's certificate) to
  # receive the policy bundles.
  port: 9445

webhook:
  # The validating webhook checks rule sets and policies before they are
  # saved. It only sees the waf.inkwall.dev kinds.
  port: 9443
  timeoutSeconds: 2
  certs:
    # rotate: the operator creates a self-signed CA and certificate, renews
    #   them, and injects the CA into the webhook configuration.
    # certManager: cert-manager issues the certificate (it must be
    #   installed); a self-signed Issuer is created unless issuerRef is set.
    mode: rotate
    certManager:
      # Empty: a self-signed Issuer created by the chart.
      issuerRef: {}
      #   kind: ClusterIssuer
      #   name: my-issuer
