# Default values for the inkwall chart. values.schema.json checks them:
# an unknown key or a wrong type fails the install.

global:
  # A registry (or mirror) that replaces ghcr.io in the operator's and the
  # engine's images, e.g. registry.example.com/inkwall: the images keep their
  # path (inkwall-dev/inkwall-operator) under it.
  imageRegistry: ""
  # Secrets the images are pulled with, by name ([{name: x}] or [x]). The
  # operator's pods use them, and the Pod webhook adds them to the proxy
  # pods it injects (Traefik, HAProxy, Istio's ingress gateways): create
  # them in the proxy namespaces too. Envoy Gateway's and Istio Gateways'
  # pods take theirs from their own configuration (the chart README).
  imagePullSecrets: []

operator:
  image:
    repository: ghcr.io/inkwall-dev/inkwall-operator
    # Empty: the chart's appVersion.
    tag: ""
    # sha256:...: pull by digest instead of the tag.
    digest: ""
    pullPolicy: IfNotPresent

  # Two replicas: one leads (builds bundles), all serve the webhook. The
  # operator is never on the request path, so traffic doesn't depend on it.
  replicas: 2

  # The operator sets the Go runtime's soft memory limit (GOMEMLIMIT) to
  # 90% of limits.memory, so its GC works harder near the limit instead of
  # letting the heap double.
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi

  # Extra inkwall-operator flags.
  extraArgs: []
  # Extra environment variables, volumes and volume mounts of the operator
  # (e.g. a proxy's HTTPS_PROXY, a CA bundle).
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []

  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  # Empty: spread the replicas across nodes when possible.
  affinity: {}
  # E.g. across zones. Rendered as a template: a labelSelector can say
  # app.kubernetes.io/instance: '{{ .Release.Name }}'.
  topologySpreadConstraints: []
  priorityClassName: ""

  podDisruptionBudget:
    # Created when replicas > 1.
    enabled: true
    minAvailable: 1

# The engine the operator injects into proxy pods (Traefik, Envoy Gateway,
# Istio, the HAProxy Kubernetes Ingress Controller) as a sidecar.
engine:
  image:
    repository: ghcr.io/inkwall-dev/inkwall-engine
    # Empty: the chart's appVersion. InkwallConfig.spec.engine.image
    # overrides both.
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent

injection:
  # Inject the engine into proxy pods when they are created (a Pod webhook).
  # While no policy is in block mode it fails open: proxy pods start even
  # when the operator is down, without the engine. Once a policy blocks, the
  # operator makes it fail closed: proxy pods can't start without the
  # engine; running ones keep serving.
  # Pods that already run are injected when they restart.
  # false: no engine is injected, and the operator unwires every route it
  # wired (new proxy pods have no engine to call), serving them uninspected.
  enabled: true
  # The namespaces the proxies' pods run in. Only pods there that an
  # integration selects (by its labels) get the engine, the trust ConfigMap
  # and read access to the policy bundle, with which their engine connects
  # to the operator. Labels can be set by whoever may create a pod, so list
  # only namespaces where the people who run the proxy create pods. A proxy
  # running elsewhere gets no engine, and its routes are not wired
  # (Programmed=False, SidecarMissing): so helm upgrade stops, naming them,
  # when pods that already run the engine are in namespaces not listed
  # (when it can reach the cluster). "*": every namespace, only for
  # clusters where everyone who may create a pod may read every policy.
  proxyNamespaces:
    - traefik
    # Where k3s and RKE2 run Traefik.
    - kube-system
    - envoy-gateway-system
    # Istio runs a Gateway's pods in the Gateway's namespace: these are
    # where its docs put Gateways; list the others yours are in.
    - istio-ingress
    - istio-system
    # The HAProxy Kubernetes Ingress Controller's, as its docs install it.
    - haproxy-controller

controlPlane:
  # The optional control plane (0002 §3.4), for GitOps and Managed mode.
  # Nothing here connects by itself: set InkwallConfig.spec.mode and
  # spec.controlPlane (endpoint, enrollmentSecretRef), see the README.
  #
  # The control plane's CA (PEM), when its server certificate isn't from a
  # public CA; e.g. --set-file controlPlane.caBundle=ca.crt.
  caBundle: ""
  # The one-time enrollment token from the control plane. Set, the chart
  # stores it in a Secret in the release namespace (key "token") for
  # InkwallConfig's enrollmentSecretRef: inkwall-enrollment for a release
  # named inkwall, else <release>-inkwall-enrollment. It is used once; leave
  # it empty to create that Secret yourself.
  enrollmentToken: ""
  # Each replica's buffer of security events while the control plane is
  # unreachable (an emptyDir, kept across container restarts): when full,
  # the oldest are dropped and counted. Only used when the control plane
  # accepts events.
  eventsBufferMiB: 64

uninstall:
  # On helm uninstall, stop the operator and remove Inkwall's Middleware from
  # the routes it wired before anything else is deleted (a pre-delete hook),
  # so the routes keep working, uninspected. WAFPolicy objects are kept.
  # It also removes the operator's finalizer from the WAFPolicies, so
  # deleting them or their namespace doesn't wait for an operator that is
  # gone. Without the hook, Traefik pods started after the uninstall fail
  # every protected route (they have no engine, but the routes still call
  # it), and the policies keep the finalizer: see the README.
  unwire: true

rbac:
  # Each integration's permissions are in a ClusterRole of its own. true
  # grants it, also for a proxy installed after Inkwall; a role on the
  # resources of a proxy the cluster doesn't run grants nothing usable.
  # auto grants it only when the cluster serves the proxy's API group
  # (traefik.io, gateway.envoyproxy.io, networking.istio.io,
  # ingress.v3.haproxy.org) at install or
  # upgrade time, so a proxy installed later needs another helm upgrade;
  # helm template, which can't ask the cluster, grants it. false never
  # does. Without its role, the operator disables that integration:
  # policies on the routes of its proxy report Programmed=False
  # (IntegrationDisabled), and the others work.
  integrations:
    # Traefik's Middlewares, and the references to them in Ingresses,
    # IngressRoutes and HTTPRoutes. Without it, the Pod webhook selects no
    # pod: Traefik's pods don't get the engine.
    traefik: true
    # Envoy Gateway's EnvoyProxies, EnvoyExtensionPolicies, Backends and
    # ClientTrafficPolicies, a Gateway's parametersRef.
    envoyGateway: true
    # Istio's EnvoyFilters, and the ConfigMap a Gateway's parametersRef
    # names (its deployment overlay).
    istio: true
    # The HAProxy Kubernetes Ingress Controller's Ingresses (their backend
    # snippet annotations); auto looks for its ingress.v3.haproxy.org CRDs.
    haproxy: true
    # Istio's ingress gateways (Istio's own Gateways and VirtualServices):
    # its EnvoyFilters. Without it, the Pod webhook selects no ingress
    # gateway pod.
    istioIngress: true

metrics:
  # The monitoring kit (docs/monitoring.md), all off by default. The
  # ServiceMonitor, PodMonitor and PrometheusRule need the Prometheus
  # Operator's CRDs: they are rendered only when the cluster serves
  # monitoring.coreos.com/v1, or with forceMonitoringObjects (for helm
  # template, which can't ask the cluster, or CRDs applied in the same run).
  forceMonitoringObjects: false
  secure:
    # Serve the operator's /metrics over HTTPS, only to clients whose
    # bearer token the API server authenticates and allows to get /metrics
    # (bind the <operator>-metrics-reader ClusterRole to them). Off: plain
    # HTTP to anything that reaches the port (networkPolicy.metricsFrom
    # narrows that). The ServiceMonitor follows.
    enabled: false
    certs:
      # selfSigned: the operator makes a certificate each time it starts;
      #   the ServiceMonitor doesn't verify it.
      # certManager: cert-manager issues it (it must be installed) for the
      #   metrics Service, and the ServiceMonitor verifies it; a self-signed
      #   Issuer is created unless issuerRef is set.
      mode: selfSigned
      certManager:
        issuerRef: {}
        #   kind: ClusterIssuer
        #   name: my-issuer
  serviceMonitor:
    # A ServiceMonitor (and a Service) for the operator's /metrics.
    enabled: false
    # Extra labels, e.g. the one your Prometheus selects ServiceMonitors by.
    labels: {}
    # Empty: Prometheus' scrape interval.
    interval: ""
  podMonitor:
    # A PodMonitor for the engines injected into the proxy pods, in
    # injection.proxyNamespaces, by their inkwall-admin port.
    enabled: false
    labels: {}
    interval: ""
  prometheusRule:
    # The alerts, each with a runbook in docs/monitoring.md.
    enabled: false
    labels: {}
  dashboard:
    # A Grafana dashboard in a ConfigMap, for Grafana's sidecar to load
    # (deploy/helm/inkwall/monitoring/dashboard.json, to import by hand).
    enabled: false
    # Empty: the release namespace; set it to the sidecar's.
    namespace: ""
    # The labels Grafana's sidecar looks for.
    labels:
      grafana_dashboard: "1"
    annotations: {}

serviceAccount:
  # Empty: the operator's name (inkwall-operator for a release named inkwall).
  name: ""
  annotations: {}

crds:
  # Install and upgrade the CRDs with the chart. They are kept on uninstall
  # (deleting a CRD deletes every object of its kind).
  install: true

networkPolicy:
  # NetworkPolicies for the chart's pods, for clusters that deny by default
  # (the chart README's Network flows). Ingress to the operator: the
  # webhook (the API server calls it) and the probes from anywhere, the
  # distribution server from injection.proxyNamespaces (the engines), the
  # metrics from anywhere.
  enabled: false
  # NetworkPolicy peers the webhook port accepts, e.g. the API server's
  # address: [{ipBlock: {cidr: 10.0.0.10/32}}]. Empty: anywhere.
  webhookFrom: []
  # Peers the metrics port accepts, e.g. Prometheus' namespace:
  # [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: monitoring}}}].
  # Empty: anywhere.
  metricsFrom: []
  egress:
    # Also limit what the chart's pods connect to: DNS, the API server, and
    # extra.
    enabled: false
    # The API server's addresses as the network plugin sees them (after the
    # kubernetes Service's translation; kubectl get endpoints kubernetes),
    # and its ports. Empty: any address on these ports.
    apiServerCIDRs: []
    apiServerPorts: [443, 6443]
    # Extra egress rules, e.g. the optional control plane's address:
    # [{to: [{ipBlock: {cidr: 203.0.113.10/32}}], ports: [{port: 443}]}].
    extra: []

distribution:
  # Engines connect here (gRPC over TLS, with the webhook's certificate) to
  # receive the policy bundles.
  port: 9445

webhook:
  # The validating webhook checks rule sets and policies before they are
  # saved. It only sees the waf.inkwall.dev kinds.
  port: 9443
  timeoutSeconds: 2
  certs:
    # rotate: the operator creates a self-signed CA and certificate, renews
    #   them, and injects the CA into the webhook configuration.
    # certManager: cert-manager issues the certificate (it must be
    #   installed); a self-signed Issuer is created unless issuerRef is set.
    mode: rotate
    certManager:
      # Empty: a self-signed Issuer created by the chart.
      issuerRef: {}
      #   kind: ClusterIssuer
      #   name: my-issuer
