# Nightly fuzzing (0002 §10): each Go fuzz target of the parsers of untrusted
# input runs for a few minutes. Their seed corpora (testdata/fuzz) also run
# in every `make test`. A failure uploads the inputs it found; reproduce one
# with `go test -run '<Target>/<file>' ./<package>` after copying it into
# <package>/testdata/fuzz/<Target>/. A crash may be a vulnerability, and this
# repository's logs and artifacts are public: the run's output and inputs are
# encrypted to the maintainer's key (.github/fuzz-crash-key.asc), never
# printed. Report a crash privately (SECURITY.md), not in an issue.
#
# The targets are every Fuzz function (hack/ci/fuzz-targets.sh), and each
# keeps the corpus it grew (Go's fuzz cache) from night to night. A failing
# scheduled run opens an issue that names the failing targets, nothing more
# (hack/ci/report-scheduled.sh).
name: fuzz

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      fuzztime:
        description: How long each target runs (Go duration)
        default: 5m

# Each job asks for what it needs (least privilege).
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  targets:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: list
        run: echo "matrix=$(hack/ci/fuzz-targets.sh)" >>"$GITHUB_OUTPUT"

  fuzz:
    name: ${{ matrix.name }}
    needs: targets
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.targets.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
          check-latest: true
      - id: cache
        run: echo "fuzz=$(go env GOCACHE)/fuzz" >>"$GITHUB_OUTPUT"
      # The corpus the target grew on earlier nights: a new key each run,
      # restored from the latest. Interesting inputs only; a failing input
      # goes to testdata/fuzz, never the cache.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.cache.outputs.fuzz }}
          key: fuzz-${{ matrix.package }}-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-${{ matrix.package }}-${{ matrix.target }}-
      # The output names the failing input, so it goes to a file, not the log.
      - run: |
          if go test -run='^$' -fuzz="^${TARGET}\$" -fuzztime="${FUZZTIME}" "${PACKAGE}" >fuzz.log 2>&1; then
            tail -3 fuzz.log
          else
            echo "::error::${TARGET} failed; its output and inputs are in the encrypted artifact"
            exit 1
          fi
        env:
          PACKAGE: ${{ matrix.package }}
          TARGET: ${{ matrix.target }}
          FUZZTIME: ${{ inputs.fuzztime || '5m' }}
      - if: failure()
        # The failing inputs are the files the run added to the corpus.
        # Encrypted to the maintainer's key: decrypt with gpg -d.
        run: |
          mkdir -p crashers
          git ls-files --others --exclude-standard -- "${PACKAGE}/testdata/fuzz/${TARGET}" |
            xargs -r cp -t crashers
          cp fuzz.log crashers/
          gpg --batch --import .github/fuzz-crash-key.asc
          tar -czf - crashers | gpg --batch --trust-model always --encrypt \
            --recipient 0277D560C39AB55D376F03FC69AC239DF03A5023 --output crashers.tar.gz.gpg
          rm -rf crashers
        env:
          PACKAGE: ${{ matrix.package }}
          TARGET: ${{ matrix.target }}
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crashers-${{ strategy.job-index }}-${{ matrix.target }}
          path: crashers.tar.gz.gpg
          if-no-files-found: ignore
          retention-days: 14

  report:
    needs: [targets, fuzz]
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          result=success
          if [[ $TARGETS != success || $FUZZ == failure ]]; then
            result=failure
          elif [[ $FUZZ != success ]]; then
            result=$FUZZ
          fi
          # The failing targets' names only: their output and inputs are
          # encrypted (above).
          failed=$(gh run view "$GITHUB_RUN_ID" --json jobs --jq '.jobs[] | select(.conclusion == "failure") | .name' | paste -sd, - | sed 's/,/, /g')
          detail=
          [[ -n $failed ]] && detail="Failing: $failed. Their inputs are in the run's encrypted artifacts; report a crash privately (SECURITY.md)."
          hack/ci/report-scheduled.sh "$GITHUB_WORKFLOW" "$result" "$RUN_URL" "$detail"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGETS: ${{ needs.targets.result }}
          FUZZ: ${{ needs.fuzz.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
