name: ci

on:
  push:
    branches: [main, "release-*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A new push to a pull request cancels its running checks; a push to main
  # or a release branch waits instead, so every commit there gets a result
  # and e2e can save the build cache (#298). A newer push still replaces a
  # run that is only queued.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          check-latest: true
      - run: make lint

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          check-latest: true
      - run: make test
      # Operator scale with fake engines (0004 §8), at a small size; the
      # full matrix runs on demand: make scale-test SCALE=full.
      - run: make scale-test SCALE_CHANGES=5
      # The wiring controller at a small size, with its budgets: uncached
      # pod lists per reconcile, status writes per policy through a
      # rollout, memory (#373). SCALE=wiring is 5,000 policies.
      - run: make scale-test SCALE=wiring:500
      - run: make build

  image:
    # The engine and operator images must build; they are what the Helm
    # chart deploys.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # Both platforms the release publishes, so an arm64-only failure
      # shows on the PR, not at release time (#392). No QEMU: Go
      # cross-compiles.
      - run: docker buildx build --platform linux/amd64,linux/arm64 --target engine .
      - run: docker buildx build --platform linux/amd64,linux/arm64 --target operator .

  raw-envoy:
    # Raw Envoy with the engine's ext_proc adapter, in Docker (#283): the
    # samples of examples/raw-envoy validated by Envoy and run, block and
    # detect mode, and Envoy's behaviour with the engine down. Then, with
    # the same engine image, WebSocket message inspection by the engine's
    # proxy (#276).
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          check-latest: true
      - run: make raw-envoy-e2e
      - run: SKIP_BUILD=1 make websocket-e2e

  release:
    # The release configuration must stay valid: a broken one only shows
    # when a tag is pushed (.github/workflows/release.yaml).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.18.3
          args: check

  helm:
    runs-on: ubuntu-24.04
    # The chart under Helm 3 and Helm 4 (#394).
    strategy:
      fail-fast: false
      matrix:
        helm: [3, 4]
    name: helm (Helm ${{ matrix.helm }})
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          check-latest: true
      # The versions under test, hack/versions.env (#393).
      - id: versions
        run: grep -E '^[A-Z_]+=' hack/versions.env >> "$GITHUB_OUTPUT"
      - uses: azure/setup-helm@v5
        with:
          version: ${{ matrix.helm == 4 && steps.versions.outputs.HELM4_VERSION || steps.versions.outputs.HELM_VERSION }}
      - run: make helm-lint
      # The alerts' unit tests, with the Prometheus image's promtool.
      - run: make monitoring-test

  e2e-images:
    # The engine and operator images, built once for every e2e job (#391),
    # and the images' Go build cache (hack/kind/go-build-cache.sh), so they
    # compile little more than this repository's packages: about 1.2 GB,
    # saved from main once per go.sum and Dockerfile. Saving it must never
    # fail or cancel the job (#298): its steps have their own time limits
    # and continue on error, and a cache is saved only if it was extracted
    # completely.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - id: go-build
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/go-build
          key: image-go-build-${{ hashFiles('go.sum', 'Dockerfile') }}
          restore-keys: image-go-build-
      - run: hack/kind/go-build-cache.sh inject "$RUNNER_TEMP/go-build"
      - run: make image
      - run: docker save inkwall-engine:dev inkwall-operator:dev | gzip -1 > "$RUNNER_TEMP/e2e-images.tar.gz"
      - uses: actions/upload-artifact@v7
        with:
          name: e2e-images
          path: ${{ runner.temp }}/e2e-images.tar.gz
          retention-days: 1
          compression-level: 0
      - id: extract
        if: github.event_name == 'push' && steps.go-build.outputs.cache-hit != 'true'
        timeout-minutes: 10
        continue-on-error: true
        run: hack/kind/go-build-cache.sh extract "$RUNNER_TEMP/go-build"
      - if: github.event_name == 'push' && steps.extract.outcome == 'success'
        timeout-minutes: 10
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/go-build
          key: image-go-build-${{ hashFiles('go.sum', 'Dockerfile') }}

  e2e:
    # Operator milestone O2 end to end (#26): the operator installed with the
    # Helm chart, and a WAFPolicy enforced by an engine in bundle mode, on
    # kind's newest Kubernetes (the local kind cluster, and upgrade, run 1.34:
    # KIND_NODE_IMAGE in the Makefile). One job per proxy, each on its own
    # kind cluster with the images built once (#391): a failure in one
    # doesn't hide the others' results, and a flaky one reruns alone.
    needs: e2e-images
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        proxy: [traefik, raw-envoy, envoy-gateway, istio, haproxy]
    name: e2e (${{ matrix.proxy }})
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          check-latest: true
      # The versions under test, hack/versions.env (#393).
      - id: versions
        run: grep -E '^[A-Z_]+=' hack/versions.env >> "$GITHUB_OUTPUT"
      - uses: azure/setup-helm@v5
        with:
          version: ${{ steps.versions.outputs.HELM_VERSION }}
      - uses: actions/download-artifact@v8
        with:
          name: e2e-images
          path: ${{ runner.temp }}
      - run: gunzip -c "$RUNNER_TEMP/e2e-images.tar.gz" | docker load
      - run: make kind-cluster KIND_NODE_IMAGE=
      - run: make kind-e2e-${{ matrix.proxy }} SKIP_IMAGE_BUILD=1
      # The cluster's logs (every pod's, the nodes', kind's), kept a week.
      - if: failure()
        run: |
          kubectl get pods -A -o wide || true
          kubectl -n inkwall-system logs deployment/inkwall-operator --tail=100 || true
          mkdir -p "$RUNNER_TEMP/kind-logs"
          bin/kind-*/kind export logs "$RUNNER_TEMP/kind-logs" --name inkwall || true
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: kind-logs-${{ matrix.proxy }}
          path: ${{ runner.temp }}/kind-logs
          retention-days: 7

  upgrade:
    # helm upgrade from the last release to the chart and images of this
    # commit keeps routes protected through Traefik and Envoy Gateway, wired
    # once, and their policies Accepted and Programmed; uninstall restores
    # the routes (#129, #390). Every run, from the latest release; the
    # release qualification runs upgrade.yaml, from each supported minor.
    # With Helm 3 and Helm 4: install, upgrade (also --reuse-values),
    # rollback and the uninstall hook (#394).
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        helm: [3, 4]
    name: upgrade (Helm ${{ matrix.helm }})
    steps:
      # The tags: the test starts from the latest release (hack/releases).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The versions under test, hack/versions.env (#393).
      - id: versions
        run: grep -E '^[A-Z_]+=' hack/versions.env >> "$GITHUB_OUTPUT"
      - uses: azure/setup-helm@v5
        with:
          version: ${{ matrix.helm == 4 && steps.versions.outputs.HELM4_VERSION || steps.versions.outputs.HELM_VERSION }}
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          check-latest: true
      # The images' Go build cache, as in e2e-images (which saves it; this job only
      # restores it, so it has nothing to save after its test).
      - uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/go-build
          key: image-go-build-${{ hashFiles('go.sum', 'Dockerfile') }}
          restore-keys: image-go-build-
      - run: hack/kind/go-build-cache.sh inject "$RUNNER_TEMP/go-build"
      # Creates its cluster at KIND_NODE_IMAGE; KEEP=1 keeps it for the
      # step below.
      - run: KEEP=1 make kind-upgrade
        env:
          # On a release-X.Y branch, or a PR to one, it starts from X.Y's
          # latest release, never a newer one.
          UPGRADE_BRANCH: ${{ github.base_ref || github.ref_name }}
      - if: failure()
        run: |
          kubectl --context kind-inkwall-upgrade get pods -A
          kubectl --context kind-inkwall-upgrade -n inkwall-system logs deployment/inkwall-operator --tail=100 || true

  generate:
    # Generated code is committed: the protobuf code must match api/*.proto,
    # and the operator's CRDs, RBAC and webhooks (also in the Helm chart)
    # must match its markers.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          check-latest: true
      - run: make generate
      - run: git diff --exit-code

  crs:
    # Detection regression gate: the OWASP CRS test suite through the proxy.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          check-latest: true
          cache-dependency-path: test/crs/go.sum
      - run: make crs-test

  haproxy:
    # HAProxy with the engine's SPOE agent, in Docker (#282): the samples of
    # examples/haproxy validated by HAProxy and run, block and detect mode,
    # and HAProxy's behaviour with the engine down (fail closed, fail open).
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          check-latest: true
      - run: make haproxy-e2e

  bench:
    # Performance regression gate (0001 §8): benchmarks of the PR against its
    # base, interleaved, compared with benchstat. Packages whose test binary
    # the PR does not change are skipped, and a regression must repeat on a
    # re-check of the flagged benchmarks to fail (hack/bench/compare.sh).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          check-latest: true
      - run: hack/bench/compare.sh "origin/$BASE_REF"
        env:
          BASE_REF: ${{ github.base_ref }}
          OUT: bench-out
      - if: always()
        run: |
          if [ -f bench-out/summary.md ]; then
            cat bench-out/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmarks
          path: bench-out
          if-no-files-found: ignore

  vuln:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          check-latest: true
      - run: make vuln

  docs:
    # The Markdown docs must not rot (#135): internal links and anchors,
    # Contents lists and the docs index (hack/docscheck). External links are
    # too slow and flaky for every PR; docs-links.yaml checks them nightly.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          check-latest: true
      - run: make docs-check

  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
    steps:
      # Squash merges use the PR title as the commit message on main, so it
      # must follow Conventional Commits (see CONTRIBUTING.md).
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            revert
            security
