name: ci

on:
  push:
    branches: [main, "release-*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          check-latest: true
      - run: make lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          check-latest: true
      - run: make test
      - run: make build

  image:
    # The engine and operator images must build; they are what the Helm
    # chart deploys.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - run: docker buildx build --target engine .
      - run: docker buildx build --target operator .

  release:
    # The release configuration must stay valid: a broken one only shows
    # when a tag is pushed (.github/workflows/release.yaml).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.18.3
          args: check

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v5
        with:
          version: v3.19.0
      - run: make helm-lint

  e2e:
    # Operator milestone O2 end to end (#26): the operator installed with the
    # Helm chart, and a WAFPolicy enforced by an engine in bundle mode, on
    # kind's newest Kubernetes (the local kind cluster runs the oldest
    # supported one).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          check-latest: true
      - uses: azure/setup-helm@v5
        with:
          version: v3.19.0
      - run: go install sigs.k8s.io/kind@v0.33.0
      - run: kind create cluster --config hack/kind/cluster.yaml --wait 120s
      - run: make kind-e2e
      - if: failure()
        run: |
          kubectl get pods -A
          kubectl -n inkwall-system logs deployment/inkwall-operator --tail=100 || true

  generate:
    # Generated code is committed: the protobuf code must match api/*.proto,
    # and the operator's CRDs, RBAC and webhooks (also in the Helm chart)
    # must match its markers.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          check-latest: true
      - run: make generate
      - run: git diff --exit-code

  crs:
    # Detection regression gate: the OWASP CRS test suite through the proxy.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          check-latest: true
          cache-dependency-path: test/crs/go.sum
      - run: make crs-test

  bench:
    # Performance regression gate (0001 §8): benchmarks of the PR against its
    # base, interleaved, compared with benchstat. Packages whose test binary
    # the PR does not change are skipped, and a regression must repeat on a
    # re-check of the flagged benchmarks to fail (hack/bench/compare.sh).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          check-latest: true
      - run: hack/bench/compare.sh "origin/$BASE_REF"
        env:
          BASE_REF: ${{ github.base_ref }}
          OUT: bench-out
      - if: always()
        run: |
          if [ -f bench-out/summary.md ]; then
            cat bench-out/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmarks
          path: bench-out
          if-no-files-found: ignore

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          check-latest: true
      - run: make vuln

  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      # Squash merges use the PR title as the commit message on main, so it
      # must follow Conventional Commits (see CONTRIBUTING.md).
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            revert
            security
