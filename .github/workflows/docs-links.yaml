name: docs-links

# The external links in the Markdown docs (make docs-check-external), checked
# nightly and on demand rather than on every PR: other sites are slow, flaky
# and rate limit, which must not fail an unrelated change. Hosts that fail
# for reasons other than a broken link go in hack/docscheck/external-ignore.txt.
on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

# Each job asks for what it needs (least privilege).
permissions: {}

jobs:
  external-links:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
          check-latest: true
      - run: make docs-check-external
