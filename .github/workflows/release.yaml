# A release, from a v* tag on main or on a release-X.Y branch (CONTRIBUTING.md):
#   1. the engine and operator images (linux/amd64, linux/arm64) on GHCR,
#      with SBOM and provenance attestations, signed with cosign;
#   2. the Helm chart on GHCR (OCI), versioned from the tag, signed;
#   3. the binaries, signed checksums, an SBOM per archive and the GitHub
#      release with the changelog (goreleaser, .goreleaser.yaml), last, so
#      the release notes never point at images or a chart that aren't
#      published yet; and build provenance attestations of the archives.
# Signatures are keyless, with this workflow's identity. Nothing is
# published unless CI passed on the tagged commit (verify), and what was
# published is checked as a user would (check).
name: release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GORELEASER_VERSION: v2.18.3
  COSIGN_VERSION: v3.1.3
  REGISTRY: ghcr.io/inkwall-dev

jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # The CI runs of the tagged commit.
      actions: read
    outputs:
      version: ${{ steps.tag.outputs.version }}
      latest: ${{ steps.tag.outputs.latest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! $TAG =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::$TAG is not a version tag (v1.2.3 or v1.2.3-rc.1)"
            exit 1
          fi
          # Released commits are reviewed: on main, or on a release branch.
          on_branch=false
          for b in $(git for-each-ref --format='%(refname:short)' 'refs/remotes/origin/main' 'refs/remotes/origin/release-*'); do
            if git merge-base --is-ancestor "$GITHUB_SHA" "$b"; then on_branch=true; fi
          done
          if [[ $on_branch != true ]]; then
            echo "::error::$TAG is not on main or a release-X.Y branch"
            exit 1
          fi
          # latest is the highest stable version, not the newest tag: a patch
          # of an older minor version doesn't take it.
          highest=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)
          latest=false
          if [[ $TAG == "$highest" ]]; then latest=true; fi
          {
            echo "version=${TAG#v}"
            echo "latest=$latest"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing ${TAG#v} (latest: $latest)" >> "$GITHUB_STEP_SUMMARY"
      # CI must have passed on the tagged commit (#392): a push run can be
      # replaced by a newer push before it finishes, so a commit can reach
      # main without a completed run. Wait for one still running, up to an
      # hour; fail if none succeeded.
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs() {
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yaml/runs?head_sha=$GITHUB_SHA&per_page=100" \
              --jq '[.workflow_runs[] | {status, conclusion, event, html_url}]'
          }
          for _ in $(seq 120); do
            r=$(runs)
            if jq -e 'any(.[]; .conclusion == "success")' <<<"$r" >/dev/null; then
              echo "CI passed on $GITHUB_SHA: $(jq -r '[.[] | select(.conclusion == "success")][0].html_url' <<<"$r")" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if ! jq -e 'any(.[]; .status != "completed")' <<<"$r" >/dev/null; then
              echo "::error::no successful CI run on $GITHUB_SHA: $(jq -c '[.[] | {event, conclusion}]' <<<"$r")"
              exit 1
            fi
            sleep 30
          done
          echo "::error::CI on $GITHUB_SHA didn't finish within an hour"
          exit 1

  images:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      matrix:
        component: [engine, operator]
    env:
      IMAGE: ghcr.io/inkwall-dev/inkwall-${{ matrix.component }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No QEMU: Go cross-compiles on the build platform, and the final
      # stages only copy the binary.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # 0.1.0 and 0.1, without "v", as the chart's appVersion; X.Y only
          # for stable versions.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=${{ needs.verify.outputs.latest }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.component }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ needs.verify.outputs.version }}
            COMMIT=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          sbom: true
          provenance: mode=max
          push: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      # By digest: a tag can be moved, the digest can't.
      - env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "$IMAGE@$DIGEST"
          echo "$IMAGE@$DIGEST" >> "$GITHUB_STEP_SUMMARY"

  chart:
    needs: [verify, images]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The versions under test, hack/versions.env (#393).
      - id: versions
        run: grep -E '^[A-Z_]+=' hack/versions.env >> "$GITHUB_OUTPUT"
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ steps.versions.outputs.HELM_VERSION }}
      # For cosign; helm keeps its own login.
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      # The chart and the images share the version: the chart deploys the
      # images of its appVersion.
      - env:
          VERSION: ${{ needs.verify.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          helm package deploy/helm/inkwall --version "$VERSION" --app-version "$VERSION" --destination out
          echo "$GITHUB_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          helm push "out/inkwall-$VERSION.tgz" "oci://$REGISTRY/charts" 2>&1 | tee out/push.log
          digest=$(awk '/^Digest:/ {print $2}' out/push.log)
          if [[ -z $digest ]]; then
            echo "::error::no digest in the helm push output"
            exit 1
          fi
          cosign sign --yes "$REGISTRY/charts/inkwall@$digest"
          echo "$REGISTRY/charts/inkwall:$VERSION@$digest" >> "$GITHUB_STEP_SUMMARY"

  binaries:
    needs: [verify, images, chart]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      # The archives' build provenance.
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The changelog is computed from the history since the last tag.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
          check-latest: true
          # No build cache in a release: one poisoned by another workflow
          # would end up in the binaries.
          cache: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      # Syft, for the archives' SBOMs (.goreleaser.yaml sboms).
      - uses: anchore/sbom-action/download-syft@8e94d75ddd33f69f691467e42275782e4bfefe84 # v0.20.9
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAKE_LATEST: ${{ needs.verify.outputs.latest }}
          # The tag that started the run. Without it GoReleaser picks among the
          # tags on the commit, and git sorts v0.1.0-rc.2 after v0.1.0: tagging
          # a release on its last rc's commit built the rc instead.
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz

  # What was published, checked as a user would (#392): the signatures with
  # the documented identity, both platforms and the attestations of each
  # image, the chart, the checksums and a binary from the release. Release
  # candidates too.
  check:
    needs: [verify, binaries]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      TAG: ${{ github.ref_name }}
      IDENTITY: '^https://github.com/inkwall-dev/inkwall/\.github/workflows/release\.yaml@refs/tags/v'
      ISSUER: https://token.actions.githubusercontent.com
    steps:
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: images
        run: |
          for c in engine operator; do
            img="$REGISTRY/inkwall-$c:$VERSION"
            cosign verify "$img" --certificate-identity-regexp "$IDENTITY" --certificate-oidc-issuer "$ISSUER" >/dev/null
            platforms=$(docker buildx imagetools inspect "$img" --format '{{json .Manifest}}' |
              jq -r '[.manifests[] | select(.platform.os != "unknown") | .platform.os + "/" + .platform.architecture] | sort | join(",")')
            if [[ $platforms != linux/amd64,linux/arm64 ]]; then
              echo "::error::$img has platforms $platforms, want linux/amd64,linux/arm64"
              exit 1
            fi
            for p in linux/amd64 linux/arm64; do
              for a in SBOM:SPDX Provenance:SLSA; do
                if ! docker buildx imagetools inspect "$img" --format "{{json (index .${a%:*} \"$p\")}}" | jq -e "has(\"${a#*:}\")" >/dev/null; then
                  echo "::error::$img has no ${a%:*} attestation for $p"
                  exit 1
                fi
              done
            done
            echo "$img: signed, $platforms, SBOM and provenance" >> "$GITHUB_STEP_SUMMARY"
          done
      - name: chart
        run: |
          cosign verify "$REGISTRY/charts/inkwall:$VERSION" --certificate-identity-regexp "$IDENTITY" --certificate-oidc-issuer "$ISSUER" >/dev/null
          mkdir chart
          helm pull "oci://$REGISTRY/charts/inkwall" --version "$VERSION" --destination chart
          helm show chart "chart/inkwall-$VERSION.tgz" | grep -qE "^appVersion: \"?$VERSION\"?$"
          echo "chart $VERSION: signed, pulls, appVersion $VERSION" >> "$GITHUB_STEP_SUMMARY"
      - name: binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir rel && cd rel
          archive="inkwall_${VERSION}_linux_amd64.tar.gz"
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p checksums.txt -p checksums.txt.sigstore.json -p "$archive" -p "$archive.sbom.json"
          cosign verify-blob checksums.txt --bundle checksums.txt.sigstore.json \
            --certificate-identity-regexp "$IDENTITY" --certificate-oidc-issuer "$ISSUER"
          sha256sum --check --ignore-missing checksums.txt
          gh attestation verify "$archive" -R "$GITHUB_REPOSITORY"
          jq -e '.spdxVersion' "$archive.sbom.json" >/dev/null
          tar -xzf "$archive" inkwallctl
          ./inkwallctl version | tee version.txt
          grep -qx "inkwallctl $VERSION" version.txt
          echo "binaries: checksums signed and matching, provenance verified, SBOM, inkwallctl $VERSION" >> "$GITHUB_STEP_SUMMARY"
