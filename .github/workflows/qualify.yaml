name: qualify

# Release qualification (#389): the heavy tests together, against one
# commit: every proxy's e2e on kind (#391), the upgrade from each supported
# release (#390), the full operator scale test with and without responses,
# the Docker e2e tests and the CRS suite. Nightly on main, weekly on the
# supported release branches, and on demand: with images=ghcr:<version>,
# against a release candidate's published images instead of the ref's own,
# by default with that version's own tests (ref v<version>), so a check of
# a later feature doesn't run against images that predate it (#472).
# A release branch from before 0.5 has no hack/versions.env: it's tested
# with the Helm version its own CI pinned (hack/ci/ref-versions.sh), and a
# test it doesn't have yet is reported as not run, never passed (#618).
# A release is cut only after a green run (CONTRIBUTING.md, "Cutting a
# release").

on:
  schedule:
    - cron: '41 2 * * *'   # nightly: main
    - cron: '7 4 * * 6'    # weekly: the supported release branches
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to qualify. Default main, or v<version> with images=ghcr:<version>.
        type: string
        default: ''
      images:
        description: ghcr:<version> tests those published images (a release candidate's) instead of building the ref's.
        type: string
        default: ''

# Each job asks for what it needs (least privilege).
permissions: {}

concurrency:
  group: qualify-${{ github.event.schedule || inputs.ref || 'default' }}-${{ inputs.images }}
  cancel-in-progress: false

jobs:
  plan:
    # The refs to qualify: main nightly, the release branches of the two
    # newest minor versions weekly, the ref given on demand. And the Helm
    # version each is tested with.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      refs: ${{ steps.plan.outputs.refs }}
      helm: ${{ steps.plan.outputs.helm }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
          check-latest: true
      - id: plan
        env:
          SCHEDULE: ${{ github.event.schedule }}
          REF: ${{ inputs.ref }}
          IMAGES: ${{ inputs.images }}
        run: |
          case "$SCHEDULE" in
            '41 2 * * *') refs=main ;;
            '7 4 * * 6')
              # release-X.Y for each of the newest two minor versions with a
              # branch. The third supported one (SECURITY.md) misses its
              # scale target on release-0.3 (#622): it's named, not
              # qualified, so the run never reads as covering it.
              branches=$(go run ./hack/releases -minors 3 | sed -E 's/^([0-9]+\.[0-9]+)\..*/release-\1/' |
                while read -r b; do git rev-parse -q --verify "origin/$b" >/dev/null && echo "$b"; done)
              refs=$(head -n 2 <<<"$branches")
              unqualified=$(tail -n +3 <<<"$branches")
              for b in $unqualified; do
                echo "::warning::$b is supported but not qualified weekly (#622): dispatch qualify with ref $b"
              done ;;
            *) refs=$REF ;;
          esac
          if [ -n "$IMAGES" ] && ! [[ $IMAGES =~ ^ghcr:[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "images must be ghcr:<version>, got $IMAGES" >&2
            exit 1
          fi
          # Published images, on demand: their own version's tests unless a
          # ref is given; main's tests check features later images have.
          if [ -z "$SCHEDULE" ] && [ -z "$refs" ]; then
            if [ -n "$IMAGES" ]; then refs=v${IMAGES#ghcr:}; else refs=main; fi
          fi
          # Only the refs a release is qualified from (#503): main, a
          # release branch or a release tag. The jobs below check them out
          # and run their code with the default branch's context: never a
          # pull request's ref or an arbitrary commit.
          for r in $refs; do
            if ! [[ $r =~ ^(main|release-[0-9]+\.[0-9]+|v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?)$ ]]; then
              echo "ref $r is not main, release-X.Y or vX.Y.Z[-rc.N]" >&2
              exit 1
            fi
          done
          helm='{}'
          for r in $refs; do
            c=$(git rev-parse -q --verify "origin/$r^{commit}" || git rev-parse -q --verify "$r^{commit}") || {
              echo "no such ref: $r" >&2
              exit 1
            }
            # Testing published images needs the ref's Makefile to know
            # IMAGES (0.5.0 and later).
            if [ -n "$IMAGES" ] && ! git show "$c:Makefile" | grep -q '^IMAGES'; then
              echo "$r predates qualifying published images (its Makefile has no IMAGES): give a later ref" >&2
              exit 1
            fi
            # The Helm version it's tested with: its hack/versions.env, or
            # before 0.5 its CI workflow's.
            v=$(hack/ci/ref-versions.sh "$c" | sed -n 's/^HELM_VERSION=//p')
            if [ -z "$v" ]; then
              echo "$r: no Helm version (hack/ci/ref-versions.sh)" >&2
              exit 1
            fi
            helm=$(jq -c --arg r "$r" --arg v "$v" '.[$r] = $v' <<<"$helm")
          done
          echo "refs=$(jq -Rnc '[inputs | select(length > 0)]' <<<"$refs")" >>"$GITHUB_OUTPUT"
          echo "helm=$helm" >>"$GITHUB_OUTPUT"
          {
            echo "## Qualifying"
            echo
            echo "Refs: $(tr '\n' ' ' <<<"$refs")"
            echo
            echo "Images: ${IMAGES:-built from each ref}"
            echo
            echo "Helm: $(jq -r 'to_entries | map("\(.key) \(.value)") | join(", ")' <<<"$helm")"
            echo
            echo "A test a ref doesn't have yet is not run, with a warning: see the jobs' annotations."
            if [ -n "${unqualified:-}" ]; then
              echo
              echo "Supported but not qualified weekly (#622): $(tr '\n' ' ' <<<"$unqualified")"
            fi
          } >>"$GITHUB_STEP_SUMMARY"

  images:
    # The ref's images, built once for its e2e jobs; skipped for published
    # images.
    needs: plan
    if: inputs.images == ''
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 30
    strategy:
      matrix:
        ref: ${{ fromJSON(needs.plan.outputs.refs) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ matrix.ref }}
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/go-build
          key: image-go-build-${{ hashFiles('go.sum', 'Dockerfile') }}
          restore-keys: image-go-build-
      - run: hack/kind/go-build-cache.sh inject "$RUNNER_TEMP/go-build"
      - run: make image
      - run: docker save inkwall-engine:dev inkwall-operator:dev | gzip -1 > "$RUNNER_TEMP/images.tar.gz"
      - id: name
        env:
          REF: ${{ matrix.ref }}
        run: echo "name=qualify-images-${REF//\//-}" >>"$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.name.outputs.name }}
          path: ${{ runner.temp }}/images.tar.gz
          retention-days: 2
          compression-level: 0

  e2e:
    needs: [plan, images]
    # Runs with published images, when images was skipped.
    if: always() && needs.plan.result == 'success' && (needs.images.result == 'success' || needs.images.result == 'skipped')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        ref: ${{ fromJSON(needs.plan.outputs.refs) }}
        proxy: [traefik, raw-envoy, envoy-gateway, istio, haproxy]
    name: e2e ${{ matrix.proxy }} (${{ matrix.ref }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ matrix.ref }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
          check-latest: true
          # Restore only: these jobs run the ref's code (#503).
          cache: false
      # The ref's Helm version: its hack/versions.env (#393), or before 0.5
      # its CI workflow's (plan, #618).
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ fromJSON(needs.plan.outputs.helm)[matrix.ref] }}
      - id: name
        env:
          REF: ${{ matrix.ref }}
        run: echo "name=qualify-images-${REF//\//-}" >>"$GITHUB_OUTPUT"
      - if: inputs.images == ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ steps.name.outputs.name }}
          path: ${{ runner.temp }}
      - if: inputs.images == ''
        run: gunzip -c "$RUNNER_TEMP/images.tar.gz" | docker load
      - run: make kind-cluster KIND_NODE_IMAGE=
      # A release branch from before #391 has no per-proxy targets: say so
      # rather than fail.
      - id: target
        env:
          PROXY: ${{ matrix.proxy }}
        run: |
          if make -n "kind-e2e-$PROXY" >/dev/null 2>&1; then echo "ok=true" >>"$GITHUB_OUTPUT"; else
            echo "ok=false" >>"$GITHUB_OUTPUT"
            echo "::warning::make kind-e2e-$PROXY doesn't exist on this ref: not run"
          fi
      - if: steps.target.outputs.ok == 'true'
        run: make "kind-e2e-$PROXY" SKIP_IMAGE_BUILD=1 IMAGES="$IMAGES"
        env:
          PROXY: ${{ matrix.proxy }}
          IMAGES: ${{ inputs.images }}
      - if: failure()
        run: |
          kubectl get pods -A -o wide || true
          mkdir -p "$RUNNER_TEMP/kind-logs"
          kind=(bin/kind-*/kind)
          "${kind[0]}" export logs "$RUNNER_TEMP/kind-logs" --name inkwall || true
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.name.outputs.name }}-kind-logs-${{ matrix.proxy }}
          path: ${{ runner.temp }}/kind-logs
          retention-days: 7

  chaos:
    # The operator's failure modes (#379): hack/kind/chaos.sh.
    needs: [plan, images]
    # Runs with published images, when images was skipped.
    if: always() && needs.plan.result == 'success' && (needs.images.result == 'success' || needs.images.result == 'skipped')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        ref: ${{ fromJSON(needs.plan.outputs.refs) }}
    name: chaos (${{ matrix.ref }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ matrix.ref }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
          check-latest: true
          # Restore only: this job runs the ref's code (#503).
          cache: false
      # The ref's Helm version: its hack/versions.env (#393), or before 0.5
      # its CI workflow's (plan, #618).
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ fromJSON(needs.plan.outputs.helm)[matrix.ref] }}
      - id: name
        env:
          REF: ${{ matrix.ref }}
        run: echo "name=qualify-images-${REF//\//-}" >>"$GITHUB_OUTPUT"
      - if: inputs.images == ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ steps.name.outputs.name }}
          path: ${{ runner.temp }}
      - if: inputs.images == ''
        run: gunzip -c "$RUNNER_TEMP/images.tar.gz" | docker load
      - run: make kind-cluster KIND_NODE_IMAGE=
      # A release branch from before #379 has no suite: say so rather than
      # fail.
      - id: target
        run: |
          if make -n kind-chaos >/dev/null 2>&1; then echo "ok=true" >>"$GITHUB_OUTPUT"; else
            echo "ok=false" >>"$GITHUB_OUTPUT"
            echo "::warning::make kind-chaos doesn't exist on this ref: not run"
          fi
      - if: steps.target.outputs.ok == 'true'
        run: make kind-chaos SKIP_IMAGE_BUILD=1 IMAGES="$IMAGES"
        env:
          IMAGES: ${{ inputs.images }}
      - if: failure()
        run: |
          kubectl get pods -A -o wide || true
          mkdir -p "$RUNNER_TEMP/kind-logs"
          kind=(bin/kind-*/kind)
          "${kind[0]}" export logs "$RUNNER_TEMP/kind-logs" --name inkwall || true
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.name.outputs.name }}-kind-logs-chaos
          path: ${{ runner.temp }}/kind-logs
          retention-days: 7

  upgrade:
    needs: plan
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        ref: ${{ fromJSON(needs.plan.outputs.refs) }}
    uses: ./.github/workflows/upgrade.yaml
    with:
      ref: ${{ matrix.ref }}
      minors: 2
      images: ${{ inputs.images }}

  scale:
    # The operator at full scale with fake engines (envtest), without and
    # with response inspection (#344).
    needs: plan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        ref: ${{ fromJSON(needs.plan.outputs.refs) }}
        responses: ['', '1']
    name: scale full${{ matrix.responses && ', responses' || '' }} (${{ matrix.ref }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ matrix.ref }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
          check-latest: true
          # Restore only: these jobs run the ref's code (#503).
          cache: false
      # A release branch from before #344 has no response inspection to
      # scale: say so rather than run the test without it and pass.
      - id: target
        env:
          RESPONSES: ${{ matrix.responses }}
        run: |
          if [ -z "$RESPONSES" ] || grep -q '^SCALE_RESPONSES' Makefile; then echo "ok=true" >>"$GITHUB_OUTPUT"; else
            echo "ok=false" >>"$GITHUB_OUTPUT"
            echo "::warning::make scale-test has no SCALE_RESPONSES on this ref: not run"
          fi
      - if: steps.target.outputs.ok == 'true'
        run: make scale-test SCALE=full SCALE_RESPONSES="$RESPONSES" SCALE_OUT="$RUNNER_TEMP/scale.jsonl"
        env:
          RESPONSES: ${{ matrix.responses }}
      # The measurements (JSON lines), in the summary.
      - if: always()
        run: |
          if [ -f "$RUNNER_TEMP/scale.jsonl" ]; then
            { echo '```json'; cat "$RUNNER_TEMP/scale.jsonl"; echo '```'; } >>"$GITHUB_STEP_SUMMARY"
          fi

  docker-e2e:
    # Raw Envoy, the engine's proxy with WebSocket messages, and HAProxy, in
    # Docker with the ref's or the published engine.
    needs: plan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        ref: ${{ fromJSON(needs.plan.outputs.refs) }}
    name: docker e2e (${{ matrix.ref }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ matrix.ref }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
          check-latest: true
          # Restore only: these jobs run the ref's code (#503).
          cache: false
      # A release branch from before 0.4 has none of these: say so rather
      # than fail.
      - id: target
        run: |
          for t in raw-envoy websocket haproxy; do
            if make -n "$t-e2e" >/dev/null 2>&1; then echo "$t=true" >>"$GITHUB_OUTPUT"; else
              echo "$t=false" >>"$GITHUB_OUTPUT"
              echo "::warning::make $t-e2e doesn't exist on this ref: not run"
            fi
          done
      - if: steps.target.outputs.raw-envoy == 'true'
        run: make raw-envoy-e2e IMAGES="$IMAGES"
        env:
          IMAGES: ${{ inputs.images }}
      # With the engine image raw-envoy-e2e built (they came together).
      - if: steps.target.outputs.websocket == 'true'
        run: make websocket-e2e SKIP_BUILD=1 IMAGES="$IMAGES"
        env:
          IMAGES: ${{ inputs.images }}
      - if: steps.target.outputs.haproxy == 'true'
        run: make haproxy-e2e IMAGES="$IMAGES"
        env:
          IMAGES: ${{ inputs.images }}

  crs:
    needs: plan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        ref: ${{ fromJSON(needs.plan.outputs.refs) }}
    name: crs (${{ matrix.ref }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ matrix.ref }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
          check-latest: true
          # Restore only: these jobs run the ref's code (#503).
          cache: false
      - run: make crs-test

  summary:
    # One table of results in the run's summary: a release needs every row
    # green.
    needs: [plan, images, e2e, chaos, upgrade, scale, docker-e2e, crs]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          {
            echo "## Qualification"
            echo
            echo "| Job | Result |"
            echo "|---|---|"
            jq -r 'to_entries[] | "| \(.key) | \(.value.result) |"' <<<"$RESULTS"
          } >>"$GITHUB_STEP_SUMMARY"
          ! jq -e 'to_entries[] | select(.value.result != "success" and .value.result != "skipped")' <<<"$RESULTS" >/dev/null

  report:
    # A failing scheduled run opens an issue (hack/ci/report-scheduled.sh,
    # #397); the next green one closes it.
    needs: summary
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          failed=$(gh run view "$GITHUB_RUN_ID" --json jobs --jq '.jobs[] | select(.conclusion == "failure") | .name' | paste -sd, - | sed 's/,/, /g')
          detail=
          [[ -n $failed ]] && detail="Failing: $failed."
          hack/ci/report-scheduled.sh "$GITHUB_WORKFLOW ($SCHEDULE)" "$RESULT" "$RUN_URL" "$detail"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RESULT: ${{ needs.summary.result }}
          SCHEDULE: ${{ github.event.schedule }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
