# Weekly: the versions under test (hack/versions.env, #393) bumped to their
# latest upstream releases on a branch, with the docs' "tested with" lines
# and the raw Envoy sample to match, and one issue that lists the bumps and
# links to open the PR. Actions may not open pull requests here, and a PR
# opened with the workflow's token would start no CI (#556): a maintainer
# opens it from the issue's link, and CI runs on it as on any other.
name: versions

on:
  schedule:
    - cron: "37 5 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  bump:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
    steps:
      # The bump is committed through the API (signed by GitHub, #566), not
      # pushed with git: no credentials kept.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
          check-latest: true
          cache: false
      - id: bump
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          go run ./hack/versionsbump | tee bumps.txt
          if git diff --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          # One branch per run: a rerun never has to overwrite a pushed one.
          branch=deps/versions-$(date -u +%Y%m%d)-$RUN_ID
          # main requires signed commits: a commit made with git here would be
          # unsigned and its PR couldn't merge (#566). The API's
          # createCommitOnBranch makes one GitHub signs, with the files the
          # bump changed.
          base=$(git rev-parse HEAD)
          gh api -X POST "repos/$REPO/git/refs" -f ref="refs/heads/$branch" -f sha="$base" >/dev/null
          git diff --name-only | while IFS= read -r f; do
            jq -n --arg path "$f" --arg contents "$(base64 -w0 "$f")" '{path: $path, contents: $contents}'
          done | jq -s . > additions.json
          jq -n --arg repo "$REPO" --arg branch "$branch" --arg head "$base" --slurpfile additions additions.json '{
            query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }",
            variables: {input: {
              branch: {repositoryNameWithOwner: $repo, branchName: $branch},
              expectedHeadOid: $head,
              message: {headline: "build(deps): bump the versions under test"},
              fileChanges: {additions: $additions[0]}
            }}
          }' > commit.json
          gh api graphql --input commit.json -q .data.createCommitOnBranch.commit.oid

          # One open issue for the bumps: updated each week until a PR closes it.
          title="Versions under test: upstream releases to bump to"
          issue=$(gh issue list -R "$REPO" --state open --label dependencies --search "\"$title\" in:title" --json number,title \
            -q "[.[] | select(.title == \"$title\")][0].number // empty")
          if [[ -z $issue ]]; then
            issue=$(gh issue create -R "$REPO" --title "$title" --label dependencies \
              --body "The weekly versions workflow (#393) lists here the versions under test that have newer upstream releases, and links to open the PR that bumps them." | sed 's|.*/||')
          fi
          pr_title=$(jq -rn --arg v "build(deps): bump the versions under test" '$v|@uri')
          pr_body=$(jq -rn --arg v "Closes #$issue" '$v|@uri')
          {
            echo "Bumps found on $(date -u +%Y-%m-%d), on branch \`$branch\`:"
            echo
            sed 's/^/- /' bumps.txt
            echo
            echo "[Open the PR](https://github.com/$REPO/compare/main...$branch?expand=1&title=$pr_title&body=$pr_body): CI runs on it as on any other. A newer week's comment supersedes this one."
          } > comment.md
          gh issue comment "$issue" -R "$REPO" --body-file comment.md
